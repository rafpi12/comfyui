<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Model Manager Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0e0e0e; --card: #151515; --surface: #1c1c1c; --well: #121212; --raise: #232323;
            --hair: rgba(255,255,255,.08); --hair-2: rgba(255,255,255,.15); --row: rgba(255,255,255,.035);
            --ink: #f4f4f4; --ink-2: #a8a8a8; --ink-3: #6a6a6a;
            --ok: #9fd3a8; --ok-dim: rgba(159,211,168,.12);
            --warn: #e6c27a; --warn-dim: rgba(230,194,122,.12);
            --err: #ef8a76; --err-dim: rgba(239,138,118,.12);
            --info: #9ab8e8; --info-dim: rgba(154,184,232,.12);
            --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
            --mono: "Geist Mono", ui-monospace, monospace;
            --r: 10px; --head: 60px;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--sans); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
        ::selection { background: #fff; color: #000; }
        .hidden { display: none !important; }
        .spacer { flex: 1; }
        .mono { font-family: var(--mono) !important; letter-spacing: 0 !important; }
        .muted { color: var(--ink-3); font-size: 13px; }
        .err-text { color: var(--err); font-size: 13px; }

        /* ── barre du haut ── */
        .top { position: sticky; top: 0; z-index: 40; height: var(--head); display: flex; align-items: center; gap: 22px; padding: 0 24px; background: rgba(14,14,14,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--hair); }
        .brand { font: 500 16px var(--sans); letter-spacing: -0.02em; white-space: nowrap; }
        .brand em { font-style: normal; color: var(--ink-3); font-weight: 400; }
        .top nav { display: flex; gap: 4px; }
        .top nav a { color: var(--ink-3); text-decoration: none; font-size: 13.5px; padding: 6px 10px; border-radius: 8px; transition: color .15s, background .15s; }
        .top nav a:hover { color: var(--ink); background: rgba(255,255,255,.05); }
        .meter { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 14px; border: 1px solid var(--hair); border-radius: var(--r); background: var(--card); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
        .meter b { font-weight: 500; color: var(--ink); }
        .meter-track { width: 90px; height: 3px; background: var(--hair-2); border-radius: 3px; overflow: hidden; }
        #ws-bar { height: 100%; width: 0%; background: #fff; transition: width .6s ease; }
        #ws-bar.warn { background: var(--warn); } #ws-bar.crit { background: var(--err); }
        .meter-kind { color: var(--ink-3); padding: 1px 7px; border: 1px solid var(--hair-2); border-radius: 999px; font-size: 11px; }
        .meter-kind:empty { display: none; }

        /* ── boutons et champs ── */
        .btn { font: 500 13px/1 var(--sans); height: 34px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--hair-2); background: transparent; color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s, opacity .15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
        .btn:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.28); }
        .btn.primary { background: #fff; color: #0b0b0b; border-color: #fff; }
        .btn.primary:hover { background: #e2e2e2; }
        .btn.danger { color: var(--err); border-color: rgba(239,138,118,.3); }
        .btn.danger:hover { background: var(--err-dim); }
        .btn.ghost { border-color: transparent; color: var(--ink-2); }
        .btn.ghost:hover { color: var(--ink); background: rgba(255,255,255,.05); }
        .btn.lg { height: 40px; font-size: 14px; }
        .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
        .btn:disabled { opacity: .3; pointer-events: none; }
        .icon-btn { background: none; border: none; color: var(--ink-3); cursor: pointer; width: 28px; height: 28px; border-radius: 8px; flex: none; display: inline-grid; place-content: center; }
        .icon-btn:hover { color: var(--ink); background: rgba(255,255,255,.06); }
        .icon-btn.del:hover { color: var(--err); background: var(--err-dim); }

        input, select, textarea { font: 400 13.5px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); height: 36px; padding: 0 12px; outline: none; transition: border-color .15s, background .15s; min-width: 0; }
        textarea { height: auto; padding: 12px; line-height: 1.5; }
        input::placeholder, textarea::placeholder { color: var(--ink-3); }
        input:hover, select:hover, textarea:hover { border-color: var(--hair-2); }
        input:focus, select:focus, textarea:focus { border-color: rgba(255,255,255,.4); background: var(--raise); }
        select { appearance: none; padding-right: 32px; cursor: pointer;
            background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
            background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
        input[type=checkbox] { appearance: none; width: 16px; height: 16px; padding: 0; border-radius: 5px; border: 1px solid var(--hair-2); background: transparent; cursor: pointer; display: inline-grid; place-content: center; flex: none; }
        input[type=checkbox]:checked { background: #fff; border-color: #fff; }
        input[type=checkbox]:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #000; border-bottom: 2px solid #000; transform: rotate(-45deg) translate(1px,-1px); }
        .seg { display: inline-flex; background: var(--well); border: 1px solid var(--hair); border-radius: var(--r); padding: 3px; gap: 2px; }
        .seg button { height: 28px; padding: 0 11px; border: 0; background: none; color: var(--ink-3); border-radius: 7px; font: 500 12.5px var(--sans); cursor: pointer; white-space: nowrap; }
        .seg button:hover { color: var(--ink-2); }
        .seg button.on { background: var(--raise); color: var(--ink); }
        kbd { font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--hair-2); border-radius: 5px; padding: 0 5px; }

        /* ── espace de travail : catalogue + editeur ── */
        main { max-width: 1680px; margin: 0 auto; padding: 18px 24px 120px; }
        .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 18px; height: calc(100vh - var(--head) - 36px); min-height: 560px; scroll-margin-top: calc(var(--head) + 18px); }
        .card { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
        .card-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--hair); min-height: 58px; }
        .card-head h2 { margin: 0; font: 500 16px var(--sans); letter-spacing: -0.02em; }
        .count { font: 12px var(--mono); color: var(--ink-3); }
        .toolbar { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; align-items: center; }
        .search { position: relative; flex: 1; min-width: 180px; }
        .search input { width: 100%; padding-left: 34px; padding-right: 34px; }
        .search > i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 12px; }
        .search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }

        .cols { display: grid; grid-template-columns: 16px 8px minmax(0, 1fr) minmax(0, 210px) 70px; gap: 12px; align-items: center; padding: 0 18px; }
        .list-head { height: 32px; font: 12px var(--sans); color: var(--ink-3); border-bottom: 1px solid var(--hair); user-select: none; background: var(--well); }
        .list-head .sort { cursor: pointer; display: flex; gap: 5px; align-items: center; transition: color .15s; }
        .list-head .sort:hover, .list-head .sort.on { color: var(--ink); }
        .list-head .right { justify-content: flex-end; text-align: right; }
        #models-list { flex: 1; overflow-y: auto; outline: none; user-select: none; }
        .item { height: 34px; cursor: pointer; border-bottom: 1px solid var(--row); transition: background .1s; }
        .item:hover { background: rgba(255,255,255,.03); }
        .item.sel { background: rgba(255,255,255,.07); }
        .item.focus { box-shadow: inset 2px 0 0 #fff; }
        .item input[type=checkbox] { opacity: .35; }
        .item:hover input[type=checkbox], .item.sel input[type=checkbox] { opacity: 1; }
        .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-3); }
        .item.on .dot { background: var(--ok); border-color: var(--ok); }
        .fname { font: 13px var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item.on .fname, .item.sel .fname { color: var(--ink); }
        .meta { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
        .size { font: 12px var(--mono); color: var(--ink-3); text-align: right; }
        mark { background: rgba(230,194,122,.22); color: inherit; border-radius: 3px; padding: 0 1px; }
        .empty { padding: 40px 18px; text-align: center; color: var(--ink-3); }
        #preset-ui { min-width: 190px; }
        .preset-chip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 12px; border-radius: 999px; background: var(--info-dim); border: 1px solid rgba(154,184,232,.3); color: var(--info); font: 500 12.5px var(--sans); white-space: nowrap; }
        .preset-chip b { font-weight: 500; color: #fff; }
        .preset-chip .warn { color: var(--warn); }
        .preset-chip button { background: none; border: 0; color: var(--info); cursor: pointer; width: 22px; height: 22px; border-radius: 50%; }
        .preset-chip button:hover { background: rgba(154,184,232,.15); color: #fff; }
        .actionbar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--hair); background: var(--well); flex-wrap: wrap; }
        .actionbar .info { font-size: 13px; color: var(--ink-2); }
        .actionbar .info span { color: var(--ink-3); }

        /* ── editeur ── */
        .inspector.flash { animation: flash 1s ease; }
        @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.3); } 100% { box-shadow: 0 0 0 14px rgba(255,255,255,0); } }
        .badge { font: 500 11.5px var(--sans); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--hair-2); color: var(--ink-3); white-space: nowrap; }
        .badge.new { color: var(--warn); border-color: rgba(230,194,122,.3); background: var(--warn-dim); }
        .badge.in { color: var(--ok); border-color: rgba(159,211,168,.3); background: var(--ok-dim); }
        .ins-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
        .field label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
        .field input, .field select { width: 100%; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .path-wrap { position: relative; }
        .path-row { display: flex; gap: 6px; }
        .path-row input { flex: 1; }
        #path-browser { position: absolute; width: 100%; top: calc(100% + 4px); left: 0; background: var(--raise); border: 1px solid var(--hair-2); border-radius: 12px; max-height: 220px; overflow-y: auto; z-index: 50; display: none; padding: 4px; box-shadow: 0 20px 50px -12px rgba(0,0,0,.9); }
        .path-item { padding: 8px 10px; font: 12.5px var(--mono); cursor: pointer; border-radius: 8px; display: flex; gap: 10px; align-items: center; color: var(--ink-2); }
        .path-item:hover { background: rgba(255,255,255,.06); color: #fff; }
        .path-item i { color: var(--ink-3); }
        .ins-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
        .divider { height: 1px; background: var(--hair); margin: 4px 0; }
        .sub-title { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; }
        #catalogue-list { display: flex; flex-direction: column; gap: 4px; }
        .cat-entry { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--well); border: 1px solid var(--hair); }
        .cat-entry .env { font-size: 12px; color: var(--ink-3); }
        .cat-entry .file { font: 12.5px var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
        .hint { font-size: 13px; color: var(--ink-3); line-height: 1.6; padding: 12px; border: 1px dashed var(--hair-2); border-radius: var(--r); }

        /* ── workflows ── */
        .section { margin-top: 40px; scroll-margin-top: calc(var(--head) + 18px); }
        .section .card { overflow: visible; }
        .tabs { display: flex; gap: 4px; }
        .tab { font: 500 13px var(--sans); color: var(--ink-3); background: none; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; transition: color .15s, background .15s; }
        .tab:hover { color: var(--ink-2); }
        .tab.on { color: #fff; background: var(--raise); }
        .wf-pane { padding: 18px; }
        .row { display: flex; gap: 10px; align-items: center; }
        .grow { flex: 1; }
        .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px 20px; max-height: 640px; overflow-y: auto; margin-top: 18px; padding-right: 4px; }
        .tpl { cursor: pointer; }
        .tpl-img { aspect-ratio: 4/3; background: var(--surface); overflow: hidden; border-radius: 12px; }
        .tpl-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
        .tpl:hover .tpl-img img { transform: scale(1.04); }
        .tpl-title { font: 500 14px/1.3 var(--sans); margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tpl-meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dropzone { margin-top: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 120px; border: 1px dashed var(--hair-2); border-radius: 14px; cursor: pointer; transition: border-color .15s, background .15s; text-align: center; padding: 0 20px; }
        .dropzone:hover { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.02); }
        .dropzone.over, body.dragging .dropzone { border-color: #fff; background: rgba(255,255,255,.05); }
        .dz-title { font: 500 15px var(--sans); }
        .dz-sub { font-size: 12.5px; color: var(--ink-3); }
        .wf-result { border-top: 1px solid var(--hair); }
        .wf-title { padding: 16px 18px 8px; font: 500 15px var(--sans); }
        .wf-row { display: grid; grid-template-columns: 16px 12px minmax(0,1fr) auto auto auto; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--row); cursor: pointer; transition: background .1s; }
        .wf-row:hover { background: rgba(255,255,255,.03); }
        .wf-row.sel { background: rgba(255,255,255,.07); box-shadow: inset 2px 0 0 #fff; }
        .wf-icon { font: 12px var(--mono); text-align: center; }
        .wf-name { font: 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wf-path { font: 12px var(--mono); color: var(--ink-3); white-space: nowrap; }
        .wf-info { font-size: 12px; color: var(--ink-3); white-space: nowrap; display: flex; gap: 8px; align-items: center; }
        .s-present { color: var(--ok); } .s-manquant { color: var(--ink); } .s-inconnu { color: var(--warn); } .s-introuvable { color: var(--err); } .s-cours { color: var(--info); }
        .wf-name.s-present { color: var(--ink-2); }
        .chip { font: 500 11px var(--sans); padding: 3px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--hair-2); color: var(--ink-2); }
        .chip.out { color: var(--warn); border-color: rgba(230,194,122,.3); }
        .chip.fixed { color: var(--info); border-color: rgba(154,184,232,.3); }
        .src { color: var(--ink-2); }
        .mini { height: 28px; font-size: 12px; padding: 0 28px 0 8px; }
        .wf-actions { padding: 16px 18px; border-top: 1px solid var(--hair); background: var(--well); border-radius: 0 0 18px 18px; }
        .addcat { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
        .addcat label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
        .addcat em { color: var(--warn); font-style: normal; }
        .addcat input:not([type=checkbox]) { flex: 1; min-width: 200px; }

        /* ── dock telechargements / journal ── */
        .dock { position: fixed; right: 20px; bottom: 20px; width: 400px; max-width: calc(100vw - 40px); z-index: 60; background: rgba(24,24,24,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--hair-2); border-radius: 16px; box-shadow: 0 24px 60px -12px rgba(0,0,0,.85); overflow: hidden; }
        .dock-head { display: flex; align-items: center; gap: 2px; padding: 6px; }
        .dtab { font: 500 12.5px var(--sans); color: var(--ink-3); background: none; border: 0; padding: 7px 10px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
        .dtab:hover { color: var(--ink-2); }
        .dock:not(.collapsed) .dtab.on { color: #fff; background: var(--raise); }
        .dcount { font: 11px var(--mono); background: #fff; color: #000; border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; }
        .dcount:empty { display: none; }
        .ldot { width: 6px; height: 6px; border-radius: 50%; background: var(--err); }
        .dock-body { border-top: 1px solid var(--hair); max-height: 46vh; overflow-y: auto; }
        .dock.collapsed .dock-body { display: none; }
        .dock.collapsed #dock-chev { transform: rotate(180deg); }
        #tasks-ui { display: flex; flex-direction: column; gap: 6px; padding: 10px; }
        .task { padding: 10px 12px; border-radius: 12px; background: var(--well); border: 1px solid var(--hair); }
        .task-top { display: flex; justify-content: space-between; gap: 10px; font: 12.5px var(--mono); margin-bottom: 8px; }
        .task-top .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .task-top .st { font: 500 11px var(--sans); white-space: nowrap; }
        .task-track { height: 2px; background: var(--hair-2); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
        .task-fill { height: 100%; background: #fff; transition: width .5s ease; }
        .task.done .task-fill { background: var(--ok); } .task.err .task-fill { background: var(--err); }
        .task.wait .task-fill { width: 100% !important; background: var(--hair-2); animation: pulse 1.4s ease-in-out infinite; }
        .task-bottom { display: flex; justify-content: space-between; font: 11.5px var(--mono); color: var(--ink-3); }
        @keyframes pulse { 50% { opacity: .35; } }
        .dock-foot { display: flex; justify-content: flex-end; padding: 0 10px 10px; }
        #log-console { color: var(--ink-2); font: 12px/1.7 var(--mono); padding: 12px 14px; }
        #log-console .t { color: var(--ink-3); margin-right: 10px; }
        #log-console .e { color: var(--err); }

        #github-toast { position: fixed; top: 74px; left: 50%; background: #fff; color: #0b0b0b; padding: 0 18px; height: 40px; border-radius: 999px; display: flex; align-items: center; gap: 10px; transform: translate(-50%, -80px); opacity: 0; transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s; z-index: 1000; font: 500 13px var(--sans); box-shadow: 0 20px 50px -10px rgba(0,0,0,.8); }
        #github-toast.show { transform: translate(-50%, 0); opacity: 1; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,.2); }
        ::-webkit-scrollbar-track { background: transparent; }

        @media (max-width: 1100px) { .cols { grid-template-columns: 16px 8px minmax(0,1fr) 70px; } .meta, .list-head .h-meta { display: none; } }
        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; height: auto; }
            #models-list { max-height: 60vh; }
            .top nav, .meter-track { display: none; }
            main { padding: 14px 16px 120px; }
            .wf-row { grid-template-columns: 16px 12px minmax(0,1fr) auto; }
            .wf-path, .wf-info .src { display: none; }
        }
    </style>
</head>
<body>
    <div id="github-toast"><i class="fab fa-github"></i><span>Catalogue synchronisé sur GitHub</span></div>

    <header class="top">
        <div class="brand">Model Manager <em>Pro</em></div>
        <nav>
            <a href="#workspace">Catalogue</a>
            <a href="#wf-panel">Workflows</a>
        </nav>
        <span class="spacer"></span>
        <div id="disk-widget" class="meter">
            <b><span id="ws-used">…</span> / <span id="ws-total">…</span></b>
            <div class="meter-track"><div id="ws-bar"></div></div>
            <span><span id="ws-free">…</span> libres</span>
            <span id="ws-kind" class="meter-kind"></span>
        </div>
        <button onclick="syncGithub()" class="btn" title="Pousser models.json sur GitHub"><i class="fab fa-github"></i>Sync</button>
        <button onclick="refreshAll()" class="btn" title="Rescanner le disque"><i class="fas fa-rotate"></i></button>
    </header>

    <main>
        <!-- CATALOGUE + EDITEUR -->
        <section class="workspace" id="workspace">

            <div class="card">

        let presence = 'all';

        let activePreset = null;

        // ── PRESETS : fichiers de base par environnement ──

            { name: "SeedVR2 3B FP16", group: "Upscale", items: [

            { name: "Z-Image Base", group: "Image", items: [
                ["Z-Image", "z_image_bf16.safetensors"], ["Z-Image", "qwen_3_4b.safetensors"], ["Z-Image", "ae.safetensors"] ] },
            { name: "Krea 2 Turbo", group: "Image", items: [
                ["Krea 2", "krea2_turbo_fp8_scaled.safetensors"], ["Krea 2", "qwen3vl_4b_bf16.safetensors"], ["Krea 2", "qwen_image_vae.safetensors"] ] },
            { name: "Krea 2 Raw", group: "Image", items: [

                ["Flux", "flux-2-klein-9b-fp8.safetensors"], ["Flux", "qwen_3_8b_fp8mixed.safetensors"], ["Flux", "flux2-vae.safetensors"] ] },
            { name: "Qwen Image Edit 2511", group: "Image", items: [
                ["Qwen", "qwen_image_edit_2511_fp8_e4m3fn.safetensors"], ["Qwen", "qwen_2.5_vl_7b_fp8_scaled.safetensors"],

            { name: "Wan 2.2 T2V (4 steps)", group: "Vidéo", items: [
                ["Wan", "wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors"], ["Wan", "wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors"],
                ["Wan", "umt5_xxl_fp8_e4m3fn_scaled.safetensors"], ["Wan", "wan_2.1_vae.safetensors"],
                ["Wan", "wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors"], ["Wan", "wan2.2_t2v_lightx2v_4steps_lora_v1.1_low_noise.safetensors"] ] },
            { name: "Minimax H3 Ref2VA", group: "Vidéo", items: [
                ["Minimax", "minimax_h3_ref2va_pruned_int8_convrot.safetensors"], ["Minimax", "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"],
                ["Minimax", "minimax_h3_video_vae_fp16.safetensors"], ["Minimax", "minimax_h3_audio_vae_fp32.safetensors"],
                ["Minimax", "minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors"] ] },

                ["Minimax Music", "minimax_music3_dit_fp16.safetensors"], ["Minimax Music", "minimax_music3_text_encoder_pruned_int8_convrot.safetensors"],
                ["Minimax Music", "minimax_music3_dav.safetensors"] ] },
            { name: "ACE-Step 1.5 Turbo", group: "Audio", items: [
                ["ACE-Step", "ace_step_1.5_turbo_aio.safetensors"] ] },
            { name: "Stable Audio 3", group: "Audio", items: [

        function populatePresets() {
            const sel = $('preset-ui');
            sel.innerHTML = '<option value="">Preset…</option>';
            [...new Set(PRESETS.map(p => p.group))].forEach(g => {
                const og = document.createElement('optgroup'); og.label = g;
                PRESETS.forEach((p, i) => { if (p.group === g) og.appendChild(new Option(p.name, i)); });
                sel.appendChild(og);
            });
        }
        function inPreset(m) { return activePreset && activePreset.items.some(([e, f]) => e === m._env && f === m.filename); }
        function presetUnknown() {
            return activePreset.items.filter(([e, f]) => !(cfg[e] && Object.values(cfg[e]).some(l => l.some(m => m.filename === f))));
        }
        async function addPresetToCatalogue() {
            const byEnv = {};
            presetUnknown().filter(it => it[2]).forEach(([e, f, x]) => (byEnv[e] = byEnv[e] || []).push({filename: f, url: x.url, path: x.path}));
            let ok = true;
            for (const [env, items] of Object.entries(byEnv)) {
                const r = await (await fetch('/add-to-catalogue', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({env, items}) })).json();
                if (r.status !== 'ok') { ok = false; addLog('Catalogue : ' + esc(r.message || 'erreur'), true); continue; }
                addLog(`${r.added} fichier(s) ajouté(s) à « ${esc(env)} »` + (r.github_sync === 'ok' ? ', GitHub synchronisé' : ', sync GitHub échouée'), r.github_sync !== 'ok');
            }
            if (ok) showGitHubToast();
            const idx = $('preset-ui').value;
            await start(true);
            applyPreset(idx);
        }
        function applyPreset(idx) {
            if (idx === '') return clearPreset();
            activePreset = PRESETS[+idx];
            // filtres remis a zero : la liste montre exactement le contenu du preset
            $('env-ui').value = '__ALL__'; $('type-ui').value = 'all'; $('search-ui').value = '';
            presence = 'all'; document.querySelectorAll('#presence-seg button').forEach(b => b.classList.toggle('on', b.dataset.p === 'all'));
            focusKey = null; anchorIdx = null;
            loadModels();
            selected = new Set(rows.map(r => r._key));
            renderList();
            const unknown = presetUnknown();
            const addable = unknown.filter(it => it[2]).length;
            const missing = rows.filter(r => !(r._diskSize > 0)).length + unknown.length;
            $('preset-chip').innerHTML = `Preset <b>${esc(activePreset.name)}</b> · ${missing ? missing + ' à télécharger' : 'complet'}`
                + (unknown.length ? ` · <span class="warn" title="${esc(unknown.map(u => u[0] + ' / ' + u[1]).join('\n'))}">${unknown.length} hors catalogue</span>` : '')
                + (addable ? ` <button onclick="addPresetToCatalogue()" title="Inscrire ces fichiers dans models.json" style="width:auto;padding:0 8px;border-radius:999px;font:500 12px var(--sans)">Ajouter au catalogue</button>` : '')
                + `<button onclick="clearPreset()" title="Quitter le preset"><i class="fas fa-xmark"></i></button>`;
            $('preset-chip').classList.remove('hidden');
            unknown.filter(it => !it[2]).forEach(([e, f]) => addLog(`Preset ${esc(activePreset.name)} : ${esc(f)} absent de « ${esc(e)} » dans models.json, sans lien de secours`, true));
        }
        function clearPreset() {
            activePreset = null;
            $('preset-ui').value = '';
            $('preset-chip').classList.add('hidden');
            selected.clear();
            loadModels();
        }
        const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const keyOf = m => `${m._env}|${m.path}|${m.filename}`;
        const $ = id => document.getElementById(id);

        function formatSize(bytes) {
            if (!bytes) return '';
            if (bytes >= 1_073_741_824) return (bytes / 1_073_741_824).toFixed(2) + ' Go';
            if (bytes >= 1_048_576) return (bytes / 1_048_576).toFixed(0) + ' Mo';
            return (bytes / 1024).toFixed(0) + ' Ko';
        }
        function hl(text, q) {
            if (!q) return esc(text);
            const i = text.toLowerCase().indexOf(q);
            if (i < 0) return esc(text);
            return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
        }

        // ── dock ──
        let dockCurrent = 'dl';
        function dockTab(t) {
            const dock = $('dock');
            if (!dock.classList.contains('collapsed') && dockCurrent === t) { dock.classList.add('collapsed'); return; }
            dockCurrent = t;
            dock.classList.remove('collapsed');
            document.querySelectorAll('.dtab').forEach(b => b.classList.toggle('on', b.dataset.d === t));
            $('dock-dl').classList.toggle('hidden', t !== 'dl');
            $('dock-log').classList.toggle('hidden', t !== 'log');
            if (t === 'log') { $('log-dot').classList.add('hidden'); const c = $('dock').querySelector('.dock-body'); c.scrollTop = c.scrollHeight; }
        }
        function toggleDock() { $('dock').classList.toggle('collapsed'); }
        function addLog(msg, isError = false) {
            const con = $('log-console');
            con.innerHTML += `<div class="${isError ? 'e' : ''}"><span class="t">${new Date().toLocaleTimeString()}</span>${msg}</div>`;
            const body = $('dock').querySelector('.dock-body');
            if (dockCurrent === 'log') body.scrollTop = body.scrollHeight;
            if (isError && ($('dock').classList.contains('collapsed') || dockCurrent !== 'log')) $('log-dot').classList.remove('hidden');
        }
        async function purgeAria() { await fetch('/purge', {method: 'POST'}); loop(); }

        // ── demarrage ──
        async function start(reload = false) {
            try {
                cfg = await (await fetch('/config')).json();
                const envSelector = $('env-ui');
                const prevEnv = envSelector.value; envSelector.innerHTML = "";
                const environments = Object.keys(cfg).sort((a, b) => a.localeCompare(b));
                envSelector.add(new Option("Tous les environnements", "__ALL__"));
                environments.forEach(env => envSelector.add(new Option(env, env)));
                envSelector.value = (reload && cfg[prevEnv]) ? prevEnv : "__ALL__";
                $('edit-env-list').innerHTML = environments.map(env => `<option value="${esc(env)}"></option>`).join('');
                if (reload) { loadModels(); renderCatalogue($('edit-file').value.trim()); return; }
                populatePresets();
                await updateDiskState(); loadModels(); renderCatalogue();
                setInterval(loop, 2000); loop();
                updateDiskWidget(); setInterval(updateDiskWidget, 30000);
                setTimeout(async () => { await updateDiskState(); loadModels(); }, 3000);
            } catch(e) { addLog('Chargement impossible : ' + esc(e.message), true); }
        }
        async function updateDiskState() { diskFiles = await (await fetch('/scan-disk')).json(); }
        async function refreshAll() { await updateDiskState(); loadModels(); updateDiskWidget(); refreshWfPresence(); addLog('Disque rescanné'); }

        async function updateDiskWidget() {
            try {
                const d = await (await fetch('/disk-usage')).json();
                const fmt = v => v.toFixed(1) + ' Go';
                if (!d.workspace) return;
                const ws = d.workspace, bar = $('ws-bar');
                $('ws-used').textContent = fmt(ws.used_gb);
                if (ws.total_gb !== null) {
                    $('ws-total').textContent = fmt(ws.total_gb);
                    $('ws-free').textContent = fmt(ws.free_gb);
                    const kinds = {container: ['container', 'Container Disk : effacé au Stop et au Terminate'], volume: ['volume', 'Volume Disk : conservé au Stop, effacé au Terminate'], network: ['network', 'Network volume : conservé même au Terminate']};
                    const k = kinds[ws.kind] || ['', ''];
                    $('ws-kind').textContent = k[0];
                    $('disk-widget').title = k[1];
                    bar.style.width = ws.used_pct + '%';
                    bar.className = ws.used_pct > 85 ? 'crit' : ws.used_pct > 65 ? 'warn' : '';
                } else {
                    $('ws-total').textContent = '?'; $('ws-free').textContent = '…'; bar.style.width = '0%';
                }
            } catch(e) {}
        }

        // ── catalogue ──
        function loadModels(targetFilename = null) {
            const env = $('env-ui').value, type = $('type-ui').value, search = $('search-ui').value.toLowerCase().trim();
            let all = [];
            if (env === "__ALL__" || cfg[env]) {
                const envsToScan = env === "__ALL__" ? Object.keys(cfg) : [env];
                envsToScan.forEach(e => Object.keys(cfg[e]).forEach(cat => {
                    let matchType = (type === 'all');
                    if (!matchType) {
                        if (type === 'clip') matchType = (cat.includes('clip') || cat.includes('text_encoders'));
                        else if (type === 'unet') matchType = (cat.includes('unet') || cat.includes('diffusion_models'));
                        else matchType = cat.toLowerCase().includes(type.toLowerCase());
                    }
                    if (matchType) cfg[e][cat].forEach(model => { if (model.filename.toLowerCase().includes(search)) all.push({ ...model, _env: e }); });
                }));
                // Dossiers disque uniquement (prompt_generator, LLM)
                const folderCategoryMap = { "prompt_generator": "Qwen", "LLM": "Qwen" };
                ["prompt_generator", "LLM"].forEach(cat => {
                    if (env !== "__ALL__" && env !== folderCategoryMap[cat]) return;
                    (diskFiles[cat] || []).forEach(entry => {
                        if (!entry.is_folder || !entry.path.toLowerCase().includes(search)) return;
                        all.push({ filename: entry.path, path: cat, category: cat, url: "", _env: "", _isFolder: true, _diskSize: entry.size || 0, _diskPath: entry.path });
                    });
                });
            }
            all.forEach(m => {
                if (m._isFolder) return;
                const lst = diskFiles[m.path.split('/')[0]] || [];
                const fn = m.filename.toLowerCase();
                const hit = lst.find(f => { const p = (f.path || f).toLowerCase(); return p === fn || p.endsWith('/' + fn); });
                m._diskSize = hit ? (hit.size || 0) : 0;
                m._diskPath = hit ? hit.path : m.filename;
            });
            if (activePreset) all = all.filter(m => inPreset(m));
            const total = all.length, onDisk = all.filter(m => m._diskSize > 0).length;
            if (presence === 'disk') all = all.filter(m => m._diskSize > 0);
            else if (presence === 'missing') all = all.filter(m => !(m._diskSize > 0));
            all.sort((a, b) => sortState.key === 'size'
                ? ((a._diskSize || 0) - (b._diskSize || 0)) * sortState.dir
                : a.filename.localeCompare(b.filename) * sortState.dir);
            all.forEach(m => m._key = keyOf(m));
            rows = all;

            if (targetFilename) {
                const t = rows.find(r => r.filename === targetFilename);
                selected = new Set(t ? [t._key] : []);
                focusKey = t ? t._key : null;
                anchorIdx = t ? rows.indexOf(t) : null;
            } else {
                const vis = new Set(rows.map(r => r._key));
                selected = new Set([...selected].filter(k => vis.has(k)));
            }
            $('list-count').textContent = `${rows.length}${rows.length !== total ? ' / ' + total : ''} · ${onDisk} sur le disque`;
            renderList();
            if (targetFilename) scrollToFocus();
        }

        function renderList() {
            const list = $('models-list');
            const q = $('search-ui').value.toLowerCase().trim();
            if (!rows.length) { list.innerHTML = '<div class="empty">Aucun modèle ne correspond.</div>'; updateActionBar(); return; }
            list.innerHTML = rows.map((m, i) => {
                const on = m._diskSize > 0, sel = selected.has(m._key);
                const name = (m._isFolder ? '▣ ' : '') + m.filename;
                return `<div class="cols item${on ? ' on' : ''}${sel ? ' sel' : ''}${m._key === focusKey ? ' focus' : ''}" data-i="${i}">`
                    + `<input type="checkbox" tabindex="-1"${sel ? ' checked' : ''}><span class="dot"></span>`
                    + `<span class="fname" title="${esc(m.filename)}">${hl(name, q)}</span>`
                    + `<span class="meta">${esc([m._env, m.path].filter(Boolean).join(' · '))}</span>`
                    + `<span class="size">${on ? formatSize(m._diskSize) : ''}</span></div>`;
            }).join('');
            updateActionBar();
        }
        function scrollToFocus() { $('models-list').querySelector('.item.focus')?.scrollIntoView({block: 'nearest'}); }

        function updateActionBar() {
            const sel = rows.filter(r => selected.has(r._key));
            const present = sel.filter(r => r._diskSize > 0);
            const missing = sel.length - present.length;
            const presentSize = present.reduce((a, r) => a + (r._diskSize || 0), 0);
            $('sel-info').innerHTML = sel.length
                ? `${sel.length} sélectionné(s) <span>· ${present.length} sur le disque${presentSize ? ' (' + formatSize(presentSize) + ')' : ''}</span>`
                : `<span>Clic pour ouvrir · <kbd>Ctrl</kbd> ou <kbd>⇧</kbd> pour sélection multiple · <kbd>↑</kbd><kbd>↓</kbd></span>`;
            $('clear-btn').classList.toggle('hidden', !sel.length);
            $('dl-btn').disabled = !sel.length;
            $('dl-btn').querySelector('span').textContent = !sel.length ? 'Télécharger' : missing ? `Télécharger (${missing})` : 'Retélécharger';
            $('delete-btn').disabled = !present.length;
            $('delete-btn').querySelector('span').textContent = present.length ? `Supprimer (${present.length})` : 'Supprimer';
            $('check-all').checked = rows.length > 0 && rows.every(r => selected.has(r._key));
        }
        function toggleAll(on) { selected = on ? new Set(rows.map(r => r._key)) : new Set(); renderList(); }
        function clearSelection() { selected.clear(); renderList(); }

        $('models-list').addEventListener('click', e => {
            const it = e.target.closest('.item'); if (!it) return;
            const i = +it.dataset.i, m = rows[i];
            if (e.target.matches('input[type=checkbox]') || e.ctrlKey || e.metaKey) {
                selected.has(m._key) ? selected.delete(m._key) : selected.add(m._key);
                anchorIdx = i;
            } else if (e.shiftKey && anchorIdx !== null) {
                const a = Math.min(anchorIdx, i), b = Math.max(anchorIdx, i);
                for (let k = a; k <= b; k++) selected.add(rows[k]._key);
            } else {
                selected = new Set([m._key]); anchorIdx = i;
            }
            focusKey = m._key; fillEditor(m); renderList();
        });
        $('models-list').addEventListener('keydown', e => {
            if (!rows.length) return;
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                let i = rows.findIndex(r => r._key === focusKey);
                i = Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
                const m = rows[i];
                if (e.shiftKey) selected.add(m._key); else selected = new Set([m._key]);
                anchorIdx = i; focusKey = m._key; fillEditor(m); renderList(); scrollToFocus();
            } else if (e.key === 'Escape') { clearSelection(); }
            else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); toggleAll(true); }
        });
        document.addEventListener('keydown', e => {
            if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); $('search-ui').focus(); }
            if (e.key === 'Escape' && document.activeElement === $('search-ui') && $('search-ui').value) { $('search-ui').value = ''; loadModels(); }
        });

        function setPresence(p) {
            presence = p;
            document.querySelectorAll('#presence-seg button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
            loadModels();
        }
        function setSortAndReload(key) {
            if (sortState.key === key) sortState.dir *= -1; else { sortState.key = key; sortState.dir = 1; }
            const arrow = sortState.dir === 1 ? '↑' : '↓';
            $('sort-name-icon').textContent = sortState.key === 'name' ? arrow : '↕';
            $('sort-size-icon').textContent = sortState.key === 'size' ? arrow : '↕';
            $('sort-name').classList.toggle('on', sortState.key === 'name');
            $('sort-size').classList.toggle('on', sortState.key === 'size');
            loadModels();
        }

        async function startSmartDownload() {
            const all = rows.filter(r => selected.has(r._key) && r.url);
            if (!all.length) return;
            // les fichiers deja presents sont ignores ; s'ils le sont tous, on propose de retelecharger
            let sel = all.filter(r => !(r._diskSize > 0));
            if (!sel.length) {
                if (!confirm(`Les ${all.length} fichier(s) sont déjà sur le disque. Les retélécharger ?`)) return;
                sel = all;
            } else if (sel.length > 1 && !confirm(`Lancer le téléchargement de ${sel.length} fichier(s)` + (all.length > sel.length ? ` (${all.length - sel.length} déjà présent(s) ignoré(s))` : '') + ' ?')) return;
            for (const m of sel) {
                const r = await (await fetch('/download', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: m.url, path: m.path, filename: m.filename}) })).json();
                addLog(r.status === 'ok' ? `File d'attente : ${esc(m.filename)}` : `Erreur ${esc(m.filename)} : ${esc(r.message)}`, r.status !== 'ok');
            }
            dockTab('dl'); loop();
        }
        async function deleteFromDisk() {
            const sel = rows.filter(r => selected.has(r._key) && r._diskSize > 0);
            if (!sel.length) return;
            if (!confirm(`Supprimer définitivement ${sel.length} fichier(s) du disque ?`)) return;
            for (const m of sel) {
                await fetch(`/delete?cat=${encodeURIComponent(m.path)}&file=${encodeURIComponent(m._diskPath || m.filename)}`, {method: 'DELETE'});
                addLog(`Supprimé : ${esc(m._diskPath || m.filename)}`);
            }
            await updateDiskState(); loadModels(); refreshWfPresence();
        }

        // ── editeur ──
        function fillEditor(m) {
            if (!m) return;
            $('edit-env').value = m._env || ($('env-ui').value !== '__ALL__' ? $('env-ui').value : '');
            setEditCat(m.category || m.path.split('/')[0]);
            $('edit-path').value = BASE_PATH + m.path;
            $('edit-url').value = m.url || '';
            $('edit-file').value = m.filename;
            hidePathBrowser();
            renderCatalogue(m.filename);
        }
        function setEditCat(cat) {
            const sel = $('edit-cat');
            if (cat && !Array.from(sel.options).some(op => op.value === cat)) sel.add(new Option(cat, cat));
            sel.value = cat;
        }
        function resetEditor() { ['edit-url', 'edit-file', 'edit-path'].forEach(id => $(id).value = ""); hidePathBrowser(); renderCatalogue(); }
        function updatePathByCategory() { $('edit-path').value = BASE_PATH + $('edit-cat').value; hidePathBrowser(); }
        async function togglePathBrowser() {
            const browser = $('path-browser');
            if (browser.style.display === "block") return hidePathBrowser();
            const cat = $('edit-cat').value;
            const folders = await (await fetch(`/list-subfolders?category=${encodeURIComponent(cat)}`)).json();
            browser.innerHTML = folders.map(f => `<div class="path-item" onclick="setPath('${esc(cat)}', '${esc(f)}')">${f === "" ? '<i class="fas fa-level-up-alt"></i> Dossier racine' : '<i class="fas fa-folder"></i> ' + esc(f)}</div>`).join('');
            browser.style.display = "block";
        }
        function hidePathBrowser() { $('path-browser').style.display = "none"; }
        function setPath(cat, sub) { $('edit-path').value = BASE_PATH + cat + (sub ? '/' + sub.replace(/^\/+/, '') : ''); hidePathBrowser(); }
        async function autoFetchName(url) {
            const fileInput = $('edit-file'); if (!url) return;
            if (url.includes('huggingface.co')) fileInput.value = decodeURIComponent(url.split('/').pop().split('?')[0]);
            else if (url.includes('civitai.com') || url.includes('civitai.red')) {
                fileInput.value = "…";
                const d = await (await fetch(`/fetch-civitai-name?url=${encodeURIComponent(url)}`)).json(); fileInput.value = d.filename || "";
            } else return;
            renderCatalogue(fileInput.value.trim());
        }
        async function downloadFromEditor() {
            const url = $('edit-url').value.trim(), file = $('edit-file').value.trim();
            const path = $('edit-path').value.replace(BASE_PATH, "").replace(/^\/+/, "") || $('edit-cat').value;
            if (!url || !file) { addLog('URL et nom de fichier nécessaires pour télécharger.', true); return; }
            const r = await (await fetch('/download', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url, path, filename: file}) })).json();
            addLog(r.status === 'ok' ? `File d'attente : ${esc(file)}` : `Erreur ${esc(file)} : ${esc(r.message)}`, r.status !== 'ok');
            dockTab('dl'); loop();
        }

        async function saveToCatalogue() {
            const env = $('edit-env').value.trim(), cat = $('edit-cat').value;
            const url = $('edit-url').value.trim(), file = $('edit-file').value.trim();
            if (!env || !cat || !file || !url) { addLog('Environnement, catégorie, fichier et URL sont obligatoires.', true); dockTab('log'); return; }
            const isNewEnv = !cfg[env];
            const relPath = $('edit-path').value.replace(BASE_PATH, "").replace(/^\/+/, "") || cat;
            const obj = { name: file, url, path: relPath, category: cat, filename: file };
            if (!cfg[env]) cfg[env] = {};
            if (!cfg[env][cat]) cfg[env][cat] = [];
            const idx = cfg[env][cat].findIndex(m => m.filename === file);
            if (idx > -1) cfg[env][cat][idx] = obj; else cfg[env][cat].push(obj);
            const r = await fetch('/save-config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(cfg) });
            if ((await r.json()).github_sync === 'ok') showGitHubToast();
            addLog(`${idx > -1 ? 'Mis à jour' : 'Ajouté'} : ${esc(file)} dans « ${esc(env)} »`);
            if (isNewEnv) await start(true);
            wfRows.forEach(e => { if (e.filename === file) e.in_catalogue = true; });
            renderWorkflowRows();
            loadModels(file);
            renderCatalogue(file);
        }

        function renderCatalogue(filterFile = '') {
            const list = $('catalogue-list'), mode = $('ed-mode');
            if (!filterFile) {
                mode.className = 'badge'; mode.textContent = 'Vide';
                list.innerHTML = '<div class="hint">Clique un modèle dans la liste pour le modifier, ou colle une URL ci-dessus pour en ajouter un nouveau.</div>';
                return;
            }
            let html = '';
            Object.keys(cfg).forEach(env => Object.keys(cfg[env]).forEach(cat => cfg[env][cat].forEach((m, idx) => {
                if (m.filename !== filterFile) return;
                html += `<div class="cat-entry"><div style="min-width:0"><span class="env">${esc(env)} · ${esc(m.path || cat)}</span><span class="file" title="${esc(m.url)}">${esc(m.filename)}</span></div><button class="icon-btn del" title="Retirer du catalogue" onclick="removeFromCatalogue('${esc(env)}','${esc(cat)}',${idx})"><i class="fas fa-xmark"></i></button></div>`;
            })));
            mode.className = html ? 'badge in' : 'badge new';
            mode.textContent = html ? 'Dans le catalogue' : 'Nouveau';
            list.innerHTML = html || '<div class="hint">Pas encore dans models.json : complète les champs et enregistre.</div>';
        }
        async function removeFromCatalogue(e, c, i) {
            if (!confirm('Retirer ce modèle de models.json ?')) return;
            const name = cfg[e][c][i].filename;
            cfg[e][c].splice(i, 1);
            await fetch('/save-config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(cfg) });
            addLog(`Retiré du catalogue : ${esc(name)} (${esc(e)})`);
            renderCatalogue($('edit-file').value.trim()); loadModels();
        }

        function showGitHubToast() { const t = $('github-toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
        async function syncGithub() {
            const d = await (await fetch('/sync-github', { method: 'POST' })).json();
            if (d.status === 'ok') showGitHubToast();
            else addLog('Sync GitHub échoué : ' + esc(d.message || ''), true);
        }

        // ── telechargements ──
        async function loop() {
            try {
                const tasks = await (await fetch('/progress')).json();
                const completeCount = tasks.filter(t => t.status.includes('complete')).length;
                if (completeCount !== lastCompleteCount) { lastCompleteCount = completeCount; await updateDiskState(); loadModels(); refreshWfPresence(); }
                const active = tasks.filter(t => t.status === 'active' || t.status === 'waiting').length;
                $('dl-count').textContent = active || '';
                if (tasks.length > lastTaskCount && $('dock').classList.contains('collapsed')) dockTab('dl');
                lastTaskCount = tasks.length;
                $('tasks-ui').innerHTML = tasks.map(t => {
                    const isError = t.status.includes('error') || t.status.includes('Erreur');
                    const isDone = t.status === 'complete', isActive = t.status === 'active';
                    const isWaiting = isActive && t.progress === 0 && t.speed === '0 o/s';
                    const pct = Math.round(t.progress || 0);
                    const cls = isError ? 'err' : isDone ? 'done' : isWaiting ? 'wait' : '';
                    const label = isError ? t.status : (isDone ? 'Terminé' : (isWaiting ? 'En attente' : (isActive ? 'En cours' : t.status)));
                    const color = isError ? 'var(--err)' : isDone ? 'var(--ok)' : 'var(--ink-2)';
                    return `<div class="task ${cls}">
                        <div class="task-top"><span class="name" title="${esc(t.name)}">${esc(t.name)}</span><span class="st" style="color:${color}">${esc(label)}</span></div>
                        <div class="task-track"><div class="task-fill" style="width:${pct}%"></div></div>
                        <div class="task-bottom"><span>${isActive && !isWaiting ? esc(t.speed) : ''}</span><span>${isWaiting ? '' : pct + '%' + (isActive && t.eta ? ' · ' + esc(t.eta) : '')}</span></div>
                    </div>`;
                }).join('') || '<div class="muted" style="padding:8px 4px">Aucun téléchargement.</div>';
            } catch(e) {}
        }

        // ── workflows ──
        let wfRows = [], templates = [], wfSel = -1;
        const WF_FOLDERS = ["diffusion_models","loras","vae","text_encoders","clip_vision","checkpoints","upscale_models","controlnet","model_patches","latent_upscale_models","unet","embeddings"];

        function wfTab(tab) {
            document.querySelectorAll('.wf-pane').forEach(p => p.classList.toggle('hidden', p.id !== 'wf-pane-' + tab));
            document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
            if (tab === 'tpl' && !templates.length) loadTemplates();
        }
        async function loadWorkflowList() {
            try {
                const list = await (await fetch('/workflows')).json();
                const sel = $('wf-select');
                list.forEach(w => sel.add(new Option(w.replace(/\.json$/, ''), w)));
            } catch(e) {}
        }
        async function loadTemplates() {
            const grid = $('tpl-grid');
            grid.innerHTML = '<div class="muted">Chargement du catalogue…</div>';
            try {
                const d = await (await fetch('/templates-index')).json();
                if (d.error) { grid.innerHTML = `<div class="err-text">${esc(d.error)}</div>`; return; }
                templates = d.templates;
                const sel = $('tpl-cat');
                [...new Set(templates.map(t => t.category))].forEach(c => sel.add(new Option(c, c)));
                renderTemplates();
            } catch(e) { grid.innerHTML = '<div class="err-text">Catalogue indisponible.</div>'; }
        }
        function renderTemplates() {
            const q = $('tpl-search').value.toLowerCase().trim();
            const cat = $('tpl-cat').value, api = $('tpl-api').checked;
            const list = templates.filter(t => (api || !t.api) && (!cat || t.category === cat) &&
                (!q || q.split(/\s+/).every(w => [t.title, t.name, t.description, ...(t.models || []), ...(t.tags || [])].join(' ').toLowerCase().includes(w))));
            const shown = list.slice(0, 80);
            $('tpl-grid').innerHTML = shown.map(t => `
                <div class="tpl" onclick="analyzeTemplate('${esc(t.name)}')" title="${esc(t.description)}">
                    <div class="tpl-img"><img loading="lazy" src="/template-thumb/${encodeURIComponent(t.name)}?ext=${esc(t.ext)}" onerror="this.remove()"></div>
                    <div class="tpl-title">${esc(t.title)}</div>
                    <div class="tpl-meta">${esc((t.models || []).join(', '))}${t.size ? ' · ' + formatSize(t.size) : ''}</div>
                </div>`).join('') || '<div class="muted">Aucun résultat.</div>';
            $('tpl-info').textContent = `${list.length} workflow(s)` + (list.length > shown.length ? ` · ${shown.length} affichés, affine la recherche` : '');
        }
        function analyzeTemplate(name) {
            const t = templates.find(x => x.name === name);
            const env = $('wf-env');
            if (t && !env.value) {
                const envs = Object.keys(cfg);
                const guess = (t.models || []).map(m => envs.find(e => e.toLowerCase() === m.toLowerCase()) || envs.find(e => m.toLowerCase().includes(e.toLowerCase()) || e.toLowerCase().includes(m.toLowerCase()))).find(Boolean);
                env.value = guess || (t.models || [])[0] || '';
            }
            analyzeWorkflow({template: name}, t ? t.title : name);
        }
        async function pngWorkflow(file) {
            const buf = new Uint8Array(await file.arrayBuffer());
            const dv = new DataView(buf.buffer); let pos = 8; const chunks = {};
            while (pos + 8 <= buf.length) {
                const len = dv.getUint32(pos), type = String.fromCharCode(...buf.slice(pos + 4, pos + 8));
                if (type === 'tEXt' || type === 'iTXt') {
                    const data = buf.slice(pos + 8, pos + 8 + len), z = data.indexOf(0);
                    const key = new TextDecoder().decode(data.slice(0, z));
                    let rest = data.slice(z + 1);
                    if (type === 'iTXt') { let k = 2, n = 0; while (n < 2 && k < rest.length) { if (rest[k] === 0) n++; k++; } rest = rest.slice(k); }
                    chunks[key] = new TextDecoder().decode(rest);
                }
                if (type === 'IEND') break;
                pos += 12 + len;
            }
            return { text: chunks.workflow || chunks.prompt || null, gen: chunks.generation_data || null };
        }
        async function handleWfFiles(files) {
            const f = files && files[0]; if (!f) return;
            const title = f.name.replace(/\.(json|png)$/i, '');
            let text = null, gen = null;
            if (/\.png$/i.test(f.name) || f.type === 'image/png') {
                ({ text, gen } = await pngWorkflow(f));
                if (!text) { addLog(`Aucun workflow dans l'image ${esc(f.name)}.`, true); return; }
            } else text = await f.text();
            wfTab('mine');
            analyzeWorkflow(gen ? {text, generation_data: gen} : {text}, title);
        }
        (() => {
            let depth = 0;
            window.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { depth++; document.body.classList.add('dragging'); } });
            window.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
            window.addEventListener('dragover', e => e.preventDefault());
            window.addEventListener('drop', e => {
                e.preventDefault(); depth = 0; document.body.classList.remove('dragging');
                if (e.dataTransfer.files.length) { handleWfFiles(e.dataTransfer.files); $('wf-panel').scrollIntoView({behavior: 'smooth', block: 'start'}); }
            });
        })();
        function wfFile(input) {
            const f = input.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = () => { $('wf-text').value = r.result; analyzeWorkflow({text: r.result}, f.name.replace(/\.json$/, '')); };
            r.readAsText(f); input.value = '';
        }
        async function analyzeWorkflow(body, title = '') {
            if (!body.workflow && !body.template && !(body.text || '').trim()) return;
            const box = $('wf-results');
            $('wf-title').textContent = title || (body.workflow || '').replace(/\.json$/, '') || 'Workflow collé';
            $('wf-result').classList.remove('hidden');
            box.innerHTML = '<div class="muted" style="padding:0 18px 16px">Analyse…</div>';
            $('wf-actions').classList.add('hidden');
            wfSel = -1;
            const d = await (await fetch('/analyze-workflow', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) })).json();
            if (d.error) { box.innerHTML = `<div class="err-text" style="padding:0 18px 16px">${esc(d.error)}</div>`; wfRows = []; return; }
            wfRows = d;
            renderWorkflowRows();
            $('wf-result').scrollIntoView({behavior: 'smooth', block: 'start'});
        }
        function renderWorkflowRows() {
            const box = $('wf-results');
            if (!wfRows.length) {
                box.innerHTML = $('wf-result').classList.contains('hidden') ? '' : '<div class="muted" style="padding:0 18px 16px">Aucun modèle local dans ce workflow.</div>';
                $('wf-actions').classList.add('hidden'); return;
            }
            const style = {
                "present":         ["●", "s-present", "présent"],
                "manquant":        ["○", "s-manquant", ""],
                "dossier inconnu": ["?", "s-inconnu", "choisis le dossier"],
                "introuvable":     ["✕", "s-introuvable", "aucun lien : ajoute-le dans l'éditeur"],
                "en cours":        ["↓", "s-cours", "en téléchargement"],
            };
            box.innerHTML = wfRows.map((e, i) => {
                const [icon, cls, note] = style[e.status] || ["·", "", e.status];
                const canDl = e.status === "manquant" || e.status === "dossier inconnu";
                const check = canDl ? `<input type="checkbox" class="wf-check" data-i="${i}" checked onclick="event.stopPropagation()" onchange="updateWfButton()">` : '<span></span>';
                const where = e.status === "dossier inconnu"
                    ? `<select class="mini" onclick="event.stopPropagation()" onchange="wfRows[${i}].path=this.value; wfRows[${i}].status='manquant'; renderWorkflowRows()"><option value="">dossier ?</option>${WF_FOLDERS.map(f => `<option>${f}</option>`).join('')}</select>`
                    : `<span class="wf-path">${esc(e.status === 'present' ? (e.where || '') : e.path)}</span>`;
                const chips = (e.ems ? `<span class="chip fixed" title="Nom interne du site de génération : ${esc(e.ems)}${e.civitai ? ' · Civitai : ' + esc(e.civitai) : ''}">${e.civitai ? 'identifié Civitai' : 'renommé'}</span>` : '')
                    + (e.url_fixed ? '<span class="chip fixed" title="Le lien du workflow pointait vers un autre fichier : corrigé">lien corrigé</span>' : '')
                    + ((!e.in_catalogue && (e.public_url || e.url)) ? '<span class="chip out">hors catalogue</span>' : '');
                const info = [e.source && e.status !== 'present' ? `<span class="src">${esc(e.source)}</span>` : '', e.size ? formatSize(e.size) : '', note ? `<span class="${cls}">${note}</span>` : ''].filter(Boolean).join('<span style="opacity:.4">·</span>');
                return `<div class="wf-row ${i === wfSel ? 'sel' : ''}" onclick="wfSelect(${i})" title="Ouvrir dans l'éditeur">${check}<span class="wf-icon ${cls}">${icon}</span><span class="wf-name ${cls}" title="${esc(e.value)}">${esc(e.filename)}</span><span style="display:flex;gap:6px">${chips}</span>${where}<span class="wf-info">${info}</span></div>`;
            }).join('');
            updateWfButton();
        }
        function wfSelect(i) {
            const e = wfRows[i]; if (!e) return;
            wfSel = i; renderWorkflowRows();
            const inCat = Object.values(cfg).some(env => Object.values(env).some(l => l.some(m => m.filename === e.filename)));
            if (inCat) {
                $('env-ui').value = '__ALL__'; $('type-ui').value = 'all'; $('search-ui').value = '';
                presence = 'all'; document.querySelectorAll('#presence-seg button').forEach(b => b.classList.toggle('on', b.dataset.p === 'all'));
                loadModels(e.filename);
                fillEditor(rows.find(r => r._key === focusKey));
            } else {
                selected.clear(); focusKey = null; renderList();
                $('edit-env').value = $('wf-env').value;
                const folder = (e.path || '').split('/')[0];
                if (folder) setEditCat(folder);
                $('edit-path').value = BASE_PATH + (e.path || folder);
                $('edit-url').value = e.public_url || e.url || '';
                $('edit-file').value = e.filename;
                renderCatalogue(e.filename);
            }
            const ed = $('editor');
            ed.classList.remove('flash'); void ed.offsetWidth; ed.classList.add('flash');
            $('workspace').scrollIntoView({behavior: 'smooth', block: 'start'});
        }
        function refreshWfPresence() {
            if (!wfRows.length) return;
            const onDisk = new Set(Object.values(diskFiles).flat().map(f => (f.path || '').split('/').pop()));
            let changed = false;
            wfRows.forEach(e => { if (e.status === 'en cours' && onDisk.has(e.filename)) { e.status = 'present'; e.where = e.path + '/' + e.filename; changed = true; } });
            if (changed) renderWorkflowRows();
        }
        function wfChecked() { return Array.from(document.querySelectorAll('.wf-check:checked')).map(c => wfRows[+c.dataset.i]).filter(e => e.status === 'manquant' && e.path); }
        function wfCatalogueCandidates() { return wfRows.filter(e => !e.in_catalogue && (e.public_url || e.url) && e.path && e.status !== 'dossier inconnu'); }
        function updateWfButton() {
            const checked = wfChecked();
            const total = checked.reduce((a, e) => a + (e.size || 0), 0);
            const cand = wfCatalogueCandidates();
            $('wf-actions').classList.toggle('hidden', checked.length === 0 && cand.length === 0);
            const dl = $('wf-dl-btn');
            dl.disabled = checked.length === 0;
            dl.textContent = `Télécharger ${checked.length} modèle(s)` + (total ? ` · ${formatSize(total)}${checked.some(e => !e.size) ? ' +' : ''}` : '');
            const cb = $('wf-cat-btn');
            cb.disabled = cand.length === 0;
            cb.textContent = `Ajouter ${cand.length} modèle(s) au catalogue`;
        }
        async function addCatalogue(list) {
            const env = $('wf-env').value.trim();
            if (!list.length) return true;
            if (!env) { addLog('Indique un environnement pour les modèles hors catalogue.', true); $('wf-env').focus(); return false; }
            const items = list.map(e => ({filename: e.filename, url: e.public_url || e.url, path: e.path}));
            const r = await (await fetch('/add-to-catalogue', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({env, items}) })).json();
            if (r.status !== 'ok') { addLog('Catalogue : ' + esc(r.message || 'erreur'), true); return false; }
            list.forEach(e => { e.in_catalogue = true; e.url_fixed = false; });
            addLog(`${r.added} modèle(s) ajouté(s) à « ${esc(env)} »` + (r.github_sync === 'ok' ? ', GitHub synchronisé' : ', sync GitHub échouée'), r.github_sync !== 'ok');
            if (r.github_sync === 'ok') showGitHubToast();
            await start(true);
            return true;
        }
        async function addWorkflowToCatalogue() { if (await addCatalogue(wfCatalogueCandidates())) renderWorkflowRows(); }
        async function downloadWorkflowModels() {
            const list = wfChecked();
            if ($('wf-addcat').checked) {
                const cand = wfCatalogueCandidates().filter(e => list.includes(e));
                if (!(await addCatalogue(cand))) return;
            }
            for (const e of list) {
                const r = await (await fetch('/download', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: e.url, path: e.path, filename: e.filename}) })).json();
                addLog(r.status === 'ok' ? `File d'attente : ${esc(e.path)}/${esc(e.filename)}` : `Erreur ${esc(e.filename)} : ${esc(r.message)}`, r.status !== 'ok');
                if (r.status === 'ok') e.status = 'en cours';
            }
            renderWorkflowRows();
            dockTab('dl'); loop();
        }

        start();
        loadWorkflowList();
        wfTab('mine');
    </script>
</body>
