<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Model Manager Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #101010; --surface: #1c1c1c; --well: #161616;
            --hair: rgba(255,255,255,.09); --hair-2: rgba(255,255,255,.16);
            --ink: #ffffff; --ink-2: #ababab; --ink-3: #6e6e6e;
            --ok: #9fd3a8; --ok-dim: rgba(159,211,168,.10);
            --warn: #e6c27a; --warn-dim: rgba(230,194,122,.10);
            --err: #ef8a76; --err-dim: rgba(239,138,118,.10);
            --info: #9ab8e8; --info-dim: rgba(154,184,232,.10);
            --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
            --mono: "Geist Mono", ui-monospace, monospace;
            --pill: 999px;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
        ::selection { background: #fff; color: #000; }
        .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 40px 80px; }
        .hidden { display: none !important; }

        /* ── en-tete ── */
        header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 28px; margin-bottom: 56px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-mark { width: 26px; height: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
        .brand-mark i { background: #fff; border-radius: 50%; }
        .brand-kicker { display: none; }
        h1 { margin: 0; font: 500 19px/1 var(--sans); letter-spacing: -0.02em; }
        h1 em { font-style: normal; color: var(--ink-3); font-weight: 400; }
        .head-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .meter { display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 20px; border: 1px solid var(--hair); border-radius: var(--pill); background: var(--surface); }
        .meter-top { display: flex; gap: 10px; font: 400 13px var(--sans); color: var(--ink-2); white-space: nowrap; }
        .meter-top > span { display: none; }
        .meter-top b { font-weight: 500; color: var(--ink); }
        .meter-track { width: 110px; height: 3px; background: var(--hair-2); border-radius: 3px; overflow: hidden; }
        #ws-bar { height: 100%; width: 0%; background: #fff; transition: width .6s ease; }
        #ws-bar.warn { background: var(--warn); } #ws-bar.crit { background: var(--err); }
        .meter-free { font: 13px var(--sans); color: var(--ink-3); white-space: nowrap; }
        .meter-free span { color: var(--ink-2); }
        .meter-free .meter-kind { color: var(--ink-3); margin-left: 6px; padding: 2px 8px; border: 1px solid var(--hair-2); border-radius: 999px; font-size: 11.5px; }
        .meter-kind:empty { display: none; }

        /* ── boutons ── */
        .btn { font: 500 14px/1 var(--sans); letter-spacing: -0.01em; height: 42px; padding: 0 20px; border-radius: var(--pill); border: 1px solid var(--hair-2); background: transparent; color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s, opacity .15s; display: inline-flex; align-items: center; justify-content: center; gap: 9px; white-space: nowrap; }
        .btn:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.28); }
        .btn.primary { background: #fff; color: #0b0b0b; border-color: #fff; }
        .btn.primary:hover { background: #e6e6e6; border-color: #e6e6e6; }
        .btn.danger { color: var(--err); border-color: rgba(239,138,118,.35); }
        .btn.danger:hover { background: var(--err-dim); }
        .btn.brass { color: var(--ink); }
        .btn.ok { color: var(--ink); }
        .btn.big { height: 48px; font-size: 15px; width: 100%; }
        .btn.sm { height: 34px; padding: 0 16px; font-size: 13px; }
        .btn:disabled { opacity: .3; pointer-events: none; }

        /* ── sections ── */
        .panel { padding: 0 0 64px; margin-bottom: 64px; border-bottom: 1px solid var(--hair); }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
        .panel-title { display: flex; align-items: baseline; gap: 14px; }
        .panel-num { font: 400 13px var(--mono); color: var(--ink-3); }
        .panel-title h2 { margin: 0; font: 500 30px/1.1 var(--sans); letter-spacing: -0.035em; }
        .panel-sub { font-size: 14px; color: var(--ink-3); }

        /* ── champs ── */
        input, select, textarea { font: 400 15px var(--sans); letter-spacing: -0.01em; color: var(--ink); background: var(--surface); border: 1px solid var(--hair); border-radius: var(--pill); height: 48px; padding: 0 20px; outline: none; transition: border-color .15s, background .15s; min-width: 0; }
        textarea { height: auto; border-radius: 18px; padding: 16px 20px; line-height: 1.5; }
        input::placeholder, textarea::placeholder { color: var(--ink-3); }
        input:hover, select:hover, textarea:hover { border-color: var(--hair-2); }
        input:focus, select:focus, textarea:focus { border-color: rgba(255,255,255,.4); background: #212121; }
        select { appearance: none; padding-right: 42px; cursor: pointer;
            background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
            background-position: calc(100% - 22px) 52%, calc(100% - 17px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
        select[multiple] { background-image: none; height: auto; border-radius: 18px; padding: 8px; }
        input[type=checkbox] { appearance: none; width: 18px; height: 18px; padding: 0; border-radius: 6px; border: 1px solid var(--hair-2); background: transparent; cursor: pointer; display: inline-grid; place-content: center; flex: none; }
        input[type=checkbox]:checked { background: #fff; border-color: #fff; }
        input[type=checkbox]:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #000; border-bottom: 2px solid #000; transform: rotate(-45deg) translate(1px,-1px); }
        .mono { font-family: var(--mono) !important; letter-spacing: 0 !important; }
        .row { display: flex; gap: 12px; align-items: center; }
        .grow { flex: 1; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .label { font: 400 13px var(--sans); color: var(--ink-3); }

        /* ── catalogue ── */
        .well { margin-top: 8px; }
        .status-line { display: flex; justify-content: space-between; align-items: center; margin: 22px 4px 12px; }
        .diode { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
        .sort-bar { display: flex; padding: 0 22px 8px; font: 400 13px var(--sans); color: var(--ink-3); user-select: none; }
        .sort-bar div { cursor: pointer; display: flex; gap: 6px; align-items: center; transition: color .15s; }
        .sort-bar div:hover, .sort-bar .on { color: var(--ink); }
        #models-ui { width: 100%; height: 300px; font: 400 13.5px/1.2 var(--mono); background: var(--well); border-color: var(--hair); }
        #models-ui option { padding: 9px 14px; border-radius: 10px; color: var(--ink-2); }
        #models-ui option:checked { background: #2a2a2a linear-gradient(0deg, #2a2a2a, #2a2a2a); color: #fff; }

        /* ── telechargements ── */
        #tasks-ui { display: grid; gap: 10px; margin: -32px 0 64px; }
        #tasks-ui:empty { display: none; }
        .task { border: 1px solid var(--hair); border-radius: 18px; padding: 16px 22px; background: var(--well); }
        .task-top { display: flex; justify-content: space-between; gap: 12px; font: 400 14px var(--mono); margin-bottom: 12px; }
        .task-top .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .task-top span:last-child { font-family: var(--sans) !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 13px !important; }
        .task-track { height: 2px; background: var(--hair-2); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
        .task-fill { height: 100%; background: #fff; transition: width .5s ease; }
        .task.done .task-fill { background: var(--ok); } .task.err .task-fill { background: var(--err); }
        .task.wait .task-fill { width: 100% !important; background: var(--hair-2); animation: pulse 1.4s ease-in-out infinite; }
        .task-bottom { display: flex; justify-content: space-between; font: 400 13px var(--mono); color: var(--ink-3); }
        @keyframes pulse { 50% { opacity: .35; } }

        /* ── editeur ── */
        .editor { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
        .editor-form { display: flex; flex-direction: column; gap: 12px; border-radius: 24px; }
        .editor.flash .editor-form { animation: flash 1.1s ease; }
        @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.35); } 100% { box-shadow: 0 0 0 18px rgba(255,255,255,0); } }
        #path-browser { position: absolute; width: 100%; top: calc(100% + 6px); left: 0; background: #1f1f1f; border: 1px solid var(--hair-2); border-radius: 18px; max-height: 220px; overflow-y: auto; z-index: 50; display: none; padding: 6px; box-shadow: 0 24px 60px -12px rgba(0,0,0,.9); }
        .path-item { padding: 10px 14px; font: 13px var(--mono); cursor: pointer; border-radius: 12px; display: flex; gap: 10px; align-items: center; color: var(--ink-2); }
        .path-item:hover { background: rgba(255,255,255,.06); color: #fff; }
        .path-item i { color: var(--ink-3); }
        #catalogue-list { border: 1px solid var(--hair); border-radius: 24px; padding: 10px; overflow-y: auto; max-height: 330px; display: flex; flex-direction: column; gap: 2px; }
        .cat-entry { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; transition: background .15s; }
        .cat-entry:hover { background: rgba(255,255,255,.04); }
        .cat-entry.hl { background: rgba(255,255,255,.07); }
        .cat-entry .env { font: 400 12.5px var(--sans); color: var(--ink-3); }
        .cat-entry .file { font: 400 13.5px var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .icon-btn { background: none; border: none; color: var(--ink-3); cursor: pointer; width: 32px; height: 32px; border-radius: 50%; flex: none; }
        .icon-btn:hover { color: var(--err); background: var(--err-dim); }
        .folder-btn { width: 48px; height: 48px; padding: 0; }

        /* ── workflow ── */
        .tabs { display: flex; gap: 26px; }
        .tab { font: 500 16px var(--sans); letter-spacing: -0.02em; color: var(--ink-3); background: none; border: none; padding: 6px 0; cursor: pointer; transition: color .15s; position: relative; }
        .tab:hover { color: var(--ink-2); }
        .tab.on { color: #fff; }
        .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 34px 28px; max-height: 760px; overflow-y: auto; padding: 4px 4px 4px 0; margin-top: 32px; }
        .tpl { cursor: pointer; }
        .tpl-img { aspect-ratio: 4/3; background: #1a1a1a; overflow: hidden; }
        .tpl-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .3s; }
        .tpl:hover .tpl-img img { transform: scale(1.03); }
        .tpl-body { padding: 12px 2px 0; }
        .tpl-title { font: 500 15px/1.3 var(--sans); letter-spacing: -0.02em; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tpl-meta { font: 400 13px var(--sans); color: var(--ink-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .muted { color: var(--ink-3); font-size: 14px; }
        .err-text { color: var(--err); font-size: 14px; }

        .wf-title { margin: 56px 0 18px; font: 500 24px var(--sans); letter-spacing: -0.03em; }
        .wf-list { display: flex; flex-direction: column; border-top: 1px solid var(--hair); }
        .wf-row { display: grid; grid-template-columns: 18px 12px minmax(0,1fr) auto auto auto; align-items: center; gap: 16px; padding: 16px 12px; border-bottom: 1px solid var(--hair); cursor: pointer; transition: background .15s; }
        .wf-row:hover { background: rgba(255,255,255,.03); }
        .wf-row.sel { background: rgba(255,255,255,.07); }
        .wf-icon { font: 12px var(--mono); text-align: center; }
        .wf-name { font: 400 14px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wf-path { font: 400 13px var(--mono); color: var(--ink-3); white-space: nowrap; }
        .wf-info { font: 400 13px var(--sans); color: var(--ink-3); white-space: nowrap; display: flex; gap: 8px; align-items: center; }
        .s-present { color: var(--ok); } .s-manquant { color: var(--ink); } .s-inconnu { color: var(--warn); } .s-introuvable { color: var(--err); } .s-cours { color: var(--info); }
        .wf-name.s-present { color: var(--ink-2); }
        .chip { font: 500 12px var(--sans); padding: 4px 10px; border-radius: var(--pill); white-space: nowrap; border: 1px solid var(--hair-2); color: var(--ink-2); }
        .chip.out { color: var(--warn); border-color: rgba(230,194,122,.3); }
        .chip.fixed { color: var(--info); border-color: rgba(154,184,232,.3); }
        .src { color: var(--ink-2); }
        .wf-actions { margin-top: 28px; }
        .addcat { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; font-size: 14px; color: var(--ink-2); flex-wrap: wrap; }
        .addcat label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
        .addcat em { color: var(--warn); font-style: normal; }
        .addcat input:not([type=checkbox]) { flex: 1; min-width: 200px; }

        /* ── journal + toast ── */
        #log-console { height: 140px; overflow-y: auto; color: var(--ink-2); font: 400 13px/1.7 var(--mono); padding: 16px 20px; border-radius: 18px; border: 1px solid var(--hair); }
        #log-console .t { color: var(--ink-3); margin-right: 12px; }
        #log-console .e { color: var(--err); }
        #github-toast { position: fixed; bottom: 28px; left: 50%; background: #fff; color: #0b0b0b; padding: 0 22px; height: 46px; border-radius: var(--pill); display: flex; align-items: center; gap: 10px; transform: translate(-50%, 120px); opacity: 0; transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s; z-index: 1000; font: 500 14px var(--sans); box-shadow: 0 20px 50px -10px rgba(0,0,0,.8); }
        #github-toast.show { transform: translate(-50%, 0); opacity: 1; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-track { background: transparent; }
        @media (max-width: 860px) { .wrap { padding: 20px 18px 60px; } .editor, .grid2 { grid-template-columns: 1fr; } .wf-row { grid-template-columns: 18px 12px minmax(0,1fr) auto; } .wf-path, .wf-info .src { display: none; } }
    </style>
</head>
<body>
    <div id="github-toast"><i class="fab fa-github"></i><span>Catalogue synchronisé sur GitHub</span></div>
    <div class="wrap">

        <header>
            <div class="brand">
                <h1>Model Manager <em>Pro</em></h1>
            </div>
            <div class="head-tools">
                <div id="disk-widget" class="meter">
                    <div class="meter-top"><span>Volume /workspace</span><b><span id="ws-used">—</span> / <span id="ws-total">—</span></b></div>
                    <div class="meter-track"><div id="ws-bar"></div></div>
                    <div class="meter-free"><span id="ws-free">—</span> libres <span id="ws-kind" class="meter-kind"></span></div>
                </div>
                <button onclick="fetch('/purge',{method:'POST'})" class="btn">Purger aria2</button>
                <button onclick="syncGithub()" class="btn ok"><i class="fab fa-github"></i>Sync</button>
                <button onclick="location.reload()" class="btn">Actualiser</button>
            </div>
        </header>

        <!-- 01 CATALOGUE -->
        <section class="panel">
            <div class="panel-head">
                <div class="panel-title"><span class="panel-num">01</span><h2>Catalogue</h2></div>
                <span class="panel-sub">● sur le disque&nbsp;&nbsp;○ à télécharger</span>
            </div>
            <div class="row" style="margin-bottom:14px">
                <select id="env-ui" style="width:24%" onchange="loadModels()"></select>
                <select id="type-ui" style="width:24%" onchange="loadModels()">
                    <option value="all">Toutes catégories</option>
                    <option value="diffusion_models">Diffusion models</option>
                    <option value="loras">LoRAs</option>
                    <option value="vae">VAE</option>
                    <option value="clip">CLIP / text encoders</option>
                    <option value="unet">UNet / GGUF</option>
                    <option value="upscale_models">Upscalers</option>
                    <option value="controlnet">ControlNet</option>
                    <option value="embeddings">Embeddings</option>
                </select>
                <input id="search-ui" type="text" placeholder="Rechercher un fichier…" class="grow" onkeyup="loadModels()">
            </div>
            <div class="well">
                <div class="status-line">
                    <div class="row" style="gap:10px"><div id="diode-ui" class="diode"></div><span id="status-text" class="label">Sélection multiple prête</span></div>
                    <div id="path-ui" class="muted" style="font-style:italic">Prêt.</div>
                </div>
                <div class="sort-bar">
                    <div class="grow" onclick="setSortAndReload('name')" id="sort-name">Fichier <span id="sort-name-icon">↕</span></div>
                    <div style="justify-content:flex-end" onclick="setSortAndReload('size')" id="sort-size"><span id="sort-size-icon">↕</span> Taille</div>
                </div>
                <select id="models-ui" multiple onclick="syncToEditor()" onchange="checkStatus()"></select>
                <div class="grid2" style="margin-top:14px">
                    <button onclick="startSmartDownload()" class="btn primary big">Télécharger la sélection</button>
                    <button id="delete-btn" onclick="deleteFromDisk()" class="btn danger big" disabled>Supprimer du disque</button>
                </div>
            </div>
        </section>

        <div id="tasks-ui"></div>

        <!-- 02 EDITEUR -->
        <section class="panel" id="editor-panel">
            <div class="panel-head">
                <div class="panel-title"><span class="panel-num">02</span><h2>Éditeur catalogue</h2></div>
                <button onclick="resetEditor()" class="btn sm">Vider</button>
            </div>
            <div class="editor" id="editor">
                <div class="editor-form">
                    <div class="grid2">
                        <div>
                            <input id="edit-env" list="edit-env-list" style="width:100%" placeholder="Environnement (existant ou nouveau)" autocomplete="off">
                            <datalist id="edit-env-list"></datalist>
                        </div>
                        <select id="edit-cat" style="width:100%" onchange="updatePathByCategory()">
                            <option value="diffusion_models">diffusion_models</option><option value="loras">loras</option><option value="vae">vae</option><option value="clip">clip</option><option value="unet">unet</option><option value="text_encoders">text_encoders</option><option value="clip_vision">clip_vision</option><option value="checkpoints">checkpoints</option><option value="upscale_models">upscale_models</option><option value="latent_upscale_models">latent_upscale_models</option><option value="controlnet">controlnet</option><option value="model_patches">model_patches</option><option value="embeddings">embeddings</option>
                        </select>
                    </div>
                    <div style="position:relative">
                        <div class="row" style="gap:8px">
                            <input id="edit-path" placeholder="Chemin" class="grow mono" style="font-size:11.5px">
                            <button onclick="togglePathBrowser()" class="btn folder-btn" title="Parcourir"><i class="fas fa-folder-open" style="color:var(--ink-2)"></i></button>
                        </div>
                        <div id="path-browser"></div>
                    </div>
                    <input id="edit-url" placeholder="URL (Hugging Face ou Civitai)" class="mono" style="font-size:11.5px" oninput="autoFetchName(this.value)">
                    <input id="edit-file" placeholder="Nom du fichier" class="mono" style="font-weight:500">
                    <button onclick="saveToCatalogue()" class="btn primary big">Enregistrer dans models.json</button>
                </div>
                <div id="catalogue-list"></div>
            </div>
        </section>

        <!-- 03 WORKFLOW -->
        <section class="panel" id="wf-panel">
            <div class="panel-head">
                <div class="panel-title"><span class="panel-num">03</span><h2>Modèles d'un workflow</h2></div>
                <div class="tabs">
                    <button class="tab" data-tab="mine" onclick="wfTab('mine')">Mes workflows</button>
                    <button class="tab" data-tab="tpl" onclick="wfTab('tpl')">Catalogue ComfyUI</button>
                    <button class="tab" data-tab="paste" onclick="wfTab('paste')">Coller / fichier</button>
                </div>
            </div>

            <div id="wf-pane-tpl" class="wf-pane">
                <div class="row">
                    <input id="tpl-search" type="text" placeholder="Rechercher : wan, flux, qwen, upscale…" class="grow" oninput="renderTemplates()">
                    <select id="tpl-cat" style="width:24%" onchange="renderTemplates()"><option value="">Toutes catégories</option></select>
                    <label class="row label" style="gap:8px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="tpl-api" onchange="renderTemplates()"> API</label>
                </div>
                <div id="tpl-grid" class="tpl-grid"></div>
                <div id="tpl-info" class="label" style="margin-top:10px"></div>
            </div>

            <div id="wf-pane-mine" class="wf-pane hidden">
                <div class="row">
                    <select id="wf-select" class="grow"><option value="">Workflows sauvegardés dans ComfyUI…</option></select>
                    <button onclick="analyzeWorkflow({workflow: document.getElementById('wf-select').value})" class="btn primary">Analyser</button>
                </div>
            </div>

            <div id="wf-pane-paste" class="wf-pane hidden">
                <textarea id="wf-text" rows="4" class="mono" style="width:100%;font-size:12px" placeholder="Colle ici un workflow JSON, ou les noms des modèles manquants (un par ligne)"></textarea>
                <div class="row" style="margin-top:10px">
                    <label class="btn" style="cursor:pointer"><i class="fas fa-file-import"></i>Fichier .json<input type="file" accept=".json" class="hidden" onchange="wfFile(this)"></label>
                    <button onclick="analyzeWorkflow({text: document.getElementById('wf-text').value})" class="btn primary">Analyser</button>
                </div>
            </div>

            <div id="wf-title" class="wf-title hidden"></div>
            <div id="wf-results" class="wf-list"></div>
            <div id="wf-actions" class="wf-actions hidden">
                <div class="addcat">
                    <label><input type="checkbox" id="wf-addcat" checked onchange="updateWfButton()"> Ajouter les modèles <em>hors catalogue</em> à models.json, environnement</label>
                    <input id="wf-env" list="edit-env-list" placeholder="Wan, Flux 2, Qwen…" autocomplete="off" oninput="updateWfButton()">
                </div>
                <div class="grid2">
                    <button id="wf-dl-btn" onclick="downloadWorkflowModels()" class="btn primary big">Télécharger</button>
                    <button id="wf-cat-btn" onclick="addWorkflowToCatalogue()" class="btn brass big">Ajouter au catalogue</button>
                </div>
            </div>
        </section>

        <div class="label" style="margin:0 0 12px 4px">Journal</div>
        <div id="log-console"></div>
    </div>

    <script>
        const BASE_PATH = "/workspace/ComfyUI/models/";
        let cfg = {}; let diskFiles = {}; let lastCompleteCount = 0;
        let sortState = { key: 'name', dir: 1 };
        const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function formatSize(bytes) {
            if (!bytes) return '—';
            if (bytes >= 1_073_741_824) return (bytes / 1_073_741_824).toFixed(2) + ' Go';
            if (bytes >= 1_048_576) return (bytes / 1_048_576).toFixed(0) + ' Mo';
            return (bytes / 1024).toFixed(0) + ' Ko';
        }

        function addLog(msg, isError = false) {
            const con = document.getElementById('log-console');
            con.innerHTML += `<div class="${isError ? 'e' : ''}"><span class="t">${new Date().toLocaleTimeString()}</span>${msg}</div>`;
            con.scrollTop = con.scrollHeight;
        }

        async function start(reload = false) {
            try {
                const r = await fetch('/config'); cfg = await r.json();
                const envSelector = document.getElementById('env-ui');
                const prevEnv = envSelector.value; envSelector.innerHTML = "";
                const environments = Object.keys(cfg).sort((a, b) => a.localeCompare(b));
                envSelector.add(new Option("Tous les environnements", "__ALL__"));
                environments.forEach(env => envSelector.add(new Option(env, env)));
                envSelector.value = (reload && cfg[prevEnv]) ? prevEnv : "__ALL__";
                const editEnvList = document.getElementById('edit-env-list');
                editEnvList.innerHTML = "";
                environments.forEach(env => editEnvList.innerHTML += `<option value="${esc(env)}"></option>`);
                if (reload) { loadModels(); renderCatalogue(); return; }
                await updateDiskState(); loadModels(); renderCatalogue(); setInterval(loop, 2000); updateDiskWidget(); setInterval(updateDiskWidget, 30000);
                setTimeout(async () => { await updateDiskState(); loadModels(); }, 3000);
            } catch(e) { }
        }

        async function updateDiskState() { const r = await fetch('/scan-disk'); diskFiles = await r.json(); }

        async function updateDiskWidget() {
            try {
                const d = await (await fetch('/disk-usage')).json();
                const fmt = v => v.toFixed(1) + ' Go';
                if (d.workspace) {
                    const ws = d.workspace, bar = document.getElementById('ws-bar');
                    document.getElementById('ws-used').textContent = fmt(ws.used_gb);
                    if (ws.total_gb !== null) {
                        document.getElementById('ws-total').textContent = fmt(ws.total_gb);
                        document.getElementById('ws-free').textContent = fmt(ws.free_gb);
                        const kinds = {container: ['container', 'Container Disk : effacé au Stop et au Terminate'], volume: ['volume', 'Volume Disk : conservé au Stop, effacé au Terminate'], network: ['network', 'Network volume : conservé même au Terminate']};
                        const k = kinds[ws.kind] || ['', ''];
                        document.getElementById('ws-kind').textContent = k[0];
                        document.getElementById('disk-widget').title = k[1];
                        bar.style.width = ws.used_pct + '%';
                        bar.className = ws.used_pct > 85 ? 'crit' : ws.used_pct > 65 ? 'warn' : '';
                    } else {
                        document.getElementById('ws-total').textContent = '?';
                        document.getElementById('ws-free').textContent = '—';
                        bar.style.width = '0%';
                    }
                }
            } catch(e) {}
        }

        function loadModels(targetFilename = null) {
            const m = document.getElementById('models-ui'); const env = document.getElementById('env-ui').value;
            const type = document.getElementById('type-ui').value; const search = document.getElementById('search-ui').value.toLowerCase();
            const savedScroll = m.scrollTop; const selectedValues = targetFilename ? [targetFilename] : Array.from(m.selectedOptions).map(o => o.value);
            m.innerHTML = "";
            if (env !== "__ALL__" && !cfg[env]) return;

            let allModels = [];
            const envsToScan = env === "__ALL__" ? Object.keys(cfg) : [env];
            envsToScan.forEach(e => {
                Object.keys(cfg[e]).forEach(cat => {
                    let matchType = (type === 'all');
                    if (!matchType) {
                        if (type === 'clip') matchType = (cat.includes('clip') || cat.includes('text_encoders'));
                        else if (type === 'unet') matchType = (cat.includes('unet') || cat.includes('diffusion_models'));
                        else matchType = cat.toLowerCase().includes(type.toLowerCase());
                    }
                    if (matchType) {
                        cfg[e][cat].forEach(model => {
                            if (model.filename.toLowerCase().includes(search)) allModels.push({ ...model, _env: e });
                        });
                    }
                });
            });

            // Dossiers disque uniquement (prompt_generator, LLM)
            const folderCategoryMap = { "prompt_generator": "Qwen", "LLM": "Qwen" };
            ["prompt_generator", "LLM"].forEach(cat => {
                const ownerEnv = folderCategoryMap[cat];
                if (env !== "__ALL__" && env !== ownerEnv) return;
                (diskFiles[cat] || []).forEach(entry => {
                    if (!entry.is_folder) return;
                    if (!entry.path.toLowerCase().includes(search)) return;
                    allModels.push({ filename: entry.path, path: cat, category: cat, url: "", _env: "", _isFolder: true, _folderSize: entry.size || 0 });
                });
            });

            allModels.forEach(model => {
                if (model._isFolder) {
                    model._diskSize = model._folderSize || 0;
                    model._diskPath = model.filename;
                } else {
                    const diskCategoryFiles = diskFiles[model.path.split('/')[0]] || [];
                    const modelFilename = model.filename.toLowerCase();
                    const diskEntry = diskCategoryFiles.find(f => {
                        const p = (f.path || f).toLowerCase();
                        return p === modelFilename || p.endsWith('/' + modelFilename);
                    });
                    model._diskSize = diskEntry ? (diskEntry.size || 0) : 0;
                    model._diskPath = diskEntry ? diskEntry.path : model.filename;
                }
            });

            allModels.sort((a, b) => sortState.key === 'size'
                ? ((a._diskSize || 0) - (b._diskSize || 0)) * sortState.dir
                : a.filename.localeCompare(b.filename) * sortState.dir);

            allModels.forEach(model => {
                let o;
                if (model._isFolder) {
                    o = new Option("●  ▣ " + model.filename + "   " + formatSize(model._folderSize), model.filename);
                    Object.assign(o.dataset, { url: "", cat: model.path, category: model.category, env: "", size: model._folderSize || 0, isFolder: "true", diskPath: model._diskPath });
                    o.style.color = "#8fcf9b";
                } else {
                    const isPresent = model._diskSize > 0;
                    o = new Option((isPresent ? "●  " : "○  ") + model.filename + (isPresent ? "   " + formatSize(model._diskSize) : ""), model.filename);
                    Object.assign(o.dataset, { url: model.url, cat: model.path, category: model.category || model.path.split('/')[0], env: model._env || "", size: isPresent ? model._diskSize : 0, diskPath: model._diskPath });
                    if (isPresent) o.style.color = "#8fcf9b";
                }
                if (selectedValues.includes(model.filename)) o.selected = true;
                m.add(o);
            });

            if (targetFilename) {
                const i = Array.from(m.options).findIndex(o => o.selected);
                m.scrollTop = Math.max(0, i * 26 - 80);
            } else m.scrollTop = savedScroll;
            checkStatus();
        }

        function checkStatus() {
            const n = document.getElementById('models-ui').selectedOptions.length;
            document.getElementById('delete-btn').disabled = n === 0;
            document.getElementById('diode-ui').style.cssText = n ? 'background:var(--ok);' : '';
            document.getElementById('status-text').textContent = n ? `${n} sélectionné(s)` : 'Sélection multiple prête';
        }

        function syncToEditor() {
            const s = Array.from(document.getElementById('models-ui').selectedOptions); if (s.length !== 1) return;
            const o = s[0];
            document.getElementById('edit-env').value = o.dataset.env || document.getElementById('env-ui').value;
            setEditCat(o.dataset.category || o.dataset.cat.split('/')[0]);
            document.getElementById('edit-path').value = BASE_PATH + o.dataset.cat;
            document.getElementById('edit-url').value = o.dataset.url;
            document.getElementById('edit-file').value = o.value;
            renderCatalogue(o.value);
        }
        function setEditCat(cat) {
            const sel = document.getElementById('edit-cat');
            if (cat && !Array.from(sel.options).some(op => op.value === cat)) sel.add(new Option(cat, cat));
            sel.value = cat;
        }

        async function startSmartDownload() {
            const s = Array.from(document.getElementById('models-ui').selectedOptions);
            if (s.length === 0) {
                const url = document.getElementById('edit-url').value;
                const path = document.getElementById('edit-path').value.replace(BASE_PATH, "");
                const file = document.getElementById('edit-file').value;
                if (!url || !file) return;
                await fetch('/download', { method:'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url, path, filename: file}) });
                addLog(`Lancement : ${esc(file)}`);
            } else {
                if (!confirm(`Lancer le téléchargement de ${s.length} fichier(s) ?`)) return;
                for (let o of s) {
                    await fetch('/download', { method:'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: o.dataset.url, path: o.dataset.cat, filename: o.value}) });
                    addLog(`Ajout file d'attente : ${esc(o.value)}`);
                }
            }
        }

        async function deleteFromDisk() {
            const s = Array.from(document.getElementById('models-ui').selectedOptions);
            if (s.length === 0) return;
            if (!confirm(`Supprimer définitivement ${s.length} fichier(s) du disque ?`)) return;
            for (let o of s) {
                const diskPath = o.dataset.diskPath || o.value;
                await fetch(`/delete?cat=${encodeURIComponent(o.dataset.cat)}&file=${encodeURIComponent(diskPath)}`, {method:'DELETE'});
                addLog(`Supprimé : ${esc(diskPath)}`);
            }
            await updateDiskState(); loadModels(); refreshWfPresence();
        }

        function showGitHubToast() { const t = document.getElementById('github-toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
        async function syncGithub() {
            const d = await (await fetch('/sync-github', { method: 'POST' })).json();
            if (d.status === 'ok') showGitHubToast();
            else addLog('Sync GitHub échoué : ' + esc(d.message || ''), true);
        }
        function resetEditor() { ['edit-url','edit-file','edit-path'].forEach(id => document.getElementById(id).value = ""); hidePathBrowser(); renderCatalogue(); }
        function updatePathByCategory() { document.getElementById('edit-path').value = BASE_PATH + document.getElementById('edit-cat').value; hidePathBrowser(); }
        async function togglePathBrowser() {
            const browser = document.getElementById('path-browser');
            if (browser.style.display === "block") return hidePathBrowser();
            const cat = document.getElementById('edit-cat').value;
            const folders = await (await fetch(`/list-subfolders?category=${encodeURIComponent(cat)}`)).json();
            browser.innerHTML = folders.map(f => `<div class="path-item" onclick="setPath('${esc(cat)}', '${esc(f)}')">${f === "" ? '<i class="fas fa-level-up-alt"></i> Dossier racine' : '<i class="fas fa-folder"></i> ' + esc(f)}</div>`).join('');
            browser.style.display = "block";
        }
        function hidePathBrowser() { document.getElementById('path-browser').style.display = "none"; }
        function setPath(cat, sub) { const cleanSub = sub === "" ? "" : (sub.startsWith('/') ? sub : '/' + sub); document.getElementById('edit-path').value = BASE_PATH + cat + cleanSub; hidePathBrowser(); }
        async function autoFetchName(url) {
            const fileInput = document.getElementById('edit-file'); if (!url) return;
            fileInput.value = "…";
            if (url.includes('huggingface.co')) fileInput.value = decodeURIComponent(url.split('/').pop().split('?')[0]);
            else if (url.includes('civitai.com') || url.includes('civitai.red')) {
                const d = await (await fetch(`/fetch-civitai-name?url=${encodeURIComponent(url)}`)).json(); fileInput.value = d.filename || "";
            } else fileInput.value = "";
        }

        async function loop() {
            try {
                const tasks = await (await fetch('/progress')).json();
                const completeCount = tasks.filter(t => t.status.includes('complete')).length;
                if (completeCount !== lastCompleteCount) { lastCompleteCount = completeCount; await updateDiskState(); loadModels(); refreshWfPresence(); }
                document.getElementById('tasks-ui').innerHTML = tasks.map(t => {
                    const isError = t.status.includes('error') || t.status.includes('Erreur');
                    const isDone = t.status === 'complete';
                    const isActive = t.status === 'active';
                    const isWaiting = isActive && t.progress === 0 && t.speed === '0 o/s';
                    const pct = Math.round(t.progress || 0);
                    const cls = isError ? 'err' : isDone ? 'done' : isWaiting ? 'wait' : '';
                    const statusLabel = isError ? t.status : (isDone ? 'Terminé' : (isWaiting ? 'En attente' : (isActive ? 'En cours' : t.status)));
                    const color = isError ? 'var(--err)' : isDone ? 'var(--ok)' : 'var(--ink-2)';
                    return `<div class="task ${cls}">
                        <div class="task-top"><span class="name">${esc(t.name)}</span><span style="color:${color};text-transform:uppercase;letter-spacing:.1em;font-size:10.5px">${esc(statusLabel)}</span></div>
                        <div class="task-track"><div class="task-fill" style="width:${pct}%"></div></div>
                        <div class="task-bottom"><span>${isActive && !isWaiting ? esc(t.speed) : ''}</span><span>${isWaiting ? '' : pct + '%' + (isActive && t.eta ? ' · ' + esc(t.eta) : '')}</span></div>
                    </div>`;
                }).join('');
            } catch(e) {}
        }

        async function saveToCatalogue() {
            const env = document.getElementById('edit-env').value.trim();
            const cat = document.getElementById('edit-cat').value;
            const fullPath = document.getElementById('edit-path').value;
            const url = document.getElementById('edit-url').value;
            const file = document.getElementById('edit-file').value;
            if (!env || !cat || !file || !url) { addLog('Environnement, catégorie, fichier et URL sont obligatoires.', true); return; }
            const isNewEnv = !cfg[env];
            const relPath = fullPath.replace(BASE_PATH, "").replace(/^\/+/, "") || cat;
            const obj = { name: file, url: url, path: relPath, category: cat, filename: file };
            if (!cfg[env]) cfg[env] = {};
            if (!cfg[env][cat]) cfg[env][cat] = [];
            const idx = cfg[env][cat].findIndex(m => m.filename === file);
            if (idx > -1) cfg[env][cat][idx] = obj; else cfg[env][cat].push(obj);
            const r = await fetch('/save-config', { method: 'POST', body: JSON.stringify(cfg) });
            if ((await r.json()).github_sync === 'ok') showGitHubToast();
            if (isNewEnv) {
                addLog(`Nouvel environnement : ${esc(env)}`);
                document.getElementById('env-ui').add(new Option(env, env));
                document.getElementById('edit-env-list').innerHTML += `<option value="${esc(env)}"></option>`;
            }
            wfRows.forEach(e => { if (e.filename === file) e.in_catalogue = true; });
            renderWorkflowRows();
            loadModels(file);
            renderCatalogue(file);
        }

        function renderCatalogue(filterFile = null) {
            const list = document.getElementById('catalogue-list');
            let html = '';
            Object.keys(cfg).forEach(env => Object.keys(cfg[env]).forEach(cat => cfg[env][cat].forEach((m, idx) => {
                if (filterFile && m.filename !== filterFile) return;
                html += `<div class="cat-entry ${filterFile ? 'hl' : ''}"><div style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="env">${esc(env)} · ${esc(cat)}</span><span class="file" title="${esc(m.filename)}">${esc(m.filename)}</span></div><button class="icon-btn" title="Retirer du catalogue" onclick="removeFromCatalogue('${esc(env)}','${esc(cat)}',${idx})"><i class="fas fa-times"></i></button></div>`;
            })));
            list.innerHTML = html || `<div class="muted" style="padding:10px">${filterFile ? 'Pas encore dans le catalogue : complète les champs et enregistre.' : 'Catalogue vide.'}</div>`;
        }
        async function removeFromCatalogue(e, c, i) { if (confirm('Retirer ce modèle de models.json ?')) { cfg[e][c].splice(i, 1); await fetch('/save-config', { method: 'POST', body: JSON.stringify(cfg) }); renderCatalogue(); loadModels(); } }

        function setSortAndReload(key) {
            if (sortState.key === key) sortState.dir *= -1; else { sortState.key = key; sortState.dir = 1; }
            const arrow = sortState.dir === 1 ? '↑' : '↓';
            document.getElementById('sort-name-icon').textContent = sortState.key === 'name' ? arrow : '↕';
            document.getElementById('sort-size-icon').textContent = sortState.key === 'size' ? arrow : '↕';
            document.getElementById('sort-name').classList.toggle('on', sortState.key === 'name');
            document.getElementById('sort-size').classList.toggle('on', sortState.key === 'size');
            loadModels();
        }

        // ── 03 WORKFLOW : modeles manquants ──
        let wfRows = [], templates = [], wfSel = -1;
        const WF_FOLDERS = ["diffusion_models","loras","vae","text_encoders","clip_vision","checkpoints","upscale_models","controlnet","model_patches","latent_upscale_models","unet","embeddings"];

        function wfTab(tab) {
            document.querySelectorAll('.wf-pane').forEach(p => p.classList.toggle('hidden', p.id !== 'wf-pane-' + tab));
            document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
            if (tab === 'tpl' && !templates.length) loadTemplates();
        }
        async function loadWorkflowList() {
            try {
                const list = await (await fetch('/workflows')).json();
                const sel = document.getElementById('wf-select');
                list.forEach(w => sel.add(new Option(w.replace(/\.json$/, ''), w)));
            } catch(e) {}
        }
        async function loadTemplates() {
            const grid = document.getElementById('tpl-grid');
            grid.innerHTML = '<div class="muted">Chargement du catalogue…</div>';
            try {
                const d = await (await fetch('/templates-index')).json();
                if (d.error) { grid.innerHTML = `<div class="err-text">${esc(d.error)}</div>`; return; }
                templates = d.templates;
                const sel = document.getElementById('tpl-cat');
                [...new Set(templates.map(t => t.category))].forEach(c => sel.add(new Option(c, c)));
                renderTemplates();
            } catch(e) { grid.innerHTML = '<div class="err-text">Catalogue indisponible.</div>'; }
        }
        function renderTemplates() {
            const q = document.getElementById('tpl-search').value.toLowerCase().trim();
            const cat = document.getElementById('tpl-cat').value;
            const api = document.getElementById('tpl-api').checked;
            const list = templates.filter(t => (api || !t.api) && (!cat || t.category === cat) &&
                (!q || q.split(/\s+/).every(w => [t.title, t.name, t.description, ...(t.models || []), ...(t.tags || [])].join(' ').toLowerCase().includes(w))));
            const shown = list.slice(0, 80);
            document.getElementById('tpl-grid').innerHTML = shown.map(t => `
                <div class="tpl" onclick="analyzeTemplate('${esc(t.name)}')" title="${esc(t.description)}">
                    <div class="tpl-img"><img loading="lazy" src="/template-thumb/${encodeURIComponent(t.name)}?ext=${esc(t.ext)}" onerror="this.remove()"></div>
                    <div class="tpl-body">
                        <div class="tpl-title">${esc(t.title)}</div>
                        <div class="tpl-meta">${esc((t.models || []).join(', '))}${t.size ? ' · ' + formatSize(t.size) : ''}</div>
                    </div>
                </div>`).join('') || '<div class="muted">Aucun résultat.</div>';
            document.getElementById('tpl-info').textContent = `${list.length} workflow(s)` + (list.length > shown.length ? ` · ${shown.length} affichés, affine la recherche` : '');
        }
        function analyzeTemplate(name) {
            const t = templates.find(x => x.name === name);
            const env = document.getElementById('wf-env');
            if (t && !env.value) {   // propose l'environnement du catalogue qui correspond au modele du template
                const envs = Object.keys(cfg);
                const guess = (t.models || []).map(m => envs.find(e => e.toLowerCase() === m.toLowerCase()) || envs.find(e => m.toLowerCase().includes(e.toLowerCase()) || e.toLowerCase().includes(m.toLowerCase()))).find(Boolean);
                env.value = guess || (t.models || [])[0] || '';
            }
            analyzeWorkflow({template: name}, t ? t.title : name);
        }
        function wfFile(input) {
            const f = input.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = () => { document.getElementById('wf-text').value = r.result; analyzeWorkflow({text: r.result}, f.name.replace(/\.json$/, '')); };
            r.readAsText(f); input.value = '';
        }
        async function analyzeWorkflow(body, title = '') {
            if (!body.workflow && !body.template && !(body.text || '').trim()) return;
            const box = document.getElementById('wf-results');
            const head = document.getElementById('wf-title');
            head.textContent = title || (body.workflow || '').replace(/\.json$/, '') || 'Workflow collé';
            head.classList.remove('hidden');
            box.innerHTML = '<div class="muted">Analyse…</div>';
            document.getElementById('wf-actions').classList.add('hidden');
            wfSel = -1;
            const d = await (await fetch('/analyze-workflow', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })).json();
            if (d.error) { box.innerHTML = `<div class="err-text">${esc(d.error)}</div>`; wfRows = []; return; }
            wfRows = d;
            renderWorkflowRows();
            head.scrollIntoView({behavior: 'smooth', block: 'start'});
        }
        function renderWorkflowRows() {
            const box = document.getElementById('wf-results');
            if (!wfRows.length) { box.innerHTML = document.getElementById('wf-title').classList.contains('hidden') ? '' : '<div class="muted">Aucun modèle local dans ce workflow.</div>'; document.getElementById('wf-actions').classList.add('hidden'); return; }
            const style = {
                "present":         ["●", "s-present", "présent"],
                "manquant":        ["○", "s-manquant", ""],
                "dossier inconnu": ["?", "s-inconnu", "choisis le dossier"],
                "introuvable":     ["✕", "s-introuvable", "aucun lien : ajoute-le dans l'éditeur"],
                "en cours":        ["↓", "s-cours", "en téléchargement"],
            };
            box.innerHTML = wfRows.map((e, i) => {
                const [icon, cls, note] = style[e.status] || ["·", "", e.status];
                const canDl = e.status === "manquant" || e.status === "dossier inconnu";
                const check = canDl ? `<input type="checkbox" class="wf-check" data-i="${i}" checked onclick="event.stopPropagation()" onchange="updateWfButton()">` : '<span></span>';
                const where = e.status === "dossier inconnu"
                    ? `<select style="padding:5px 28px 5px 9px;font-size:11px" onclick="event.stopPropagation()" onchange="wfRows[${i}].path=this.value; wfRows[${i}].status='manquant'; renderWorkflowRows()"><option value="">dossier ?</option>${WF_FOLDERS.map(f => `<option>${f}</option>`).join('')}</select>`
                    : `<span class="wf-path">${esc(e.status === 'present' ? (e.where || '') : e.path)}</span>`;
                const chips = (e.url_fixed ? '<span class="chip fixed" title="Le lien du workflow pointait vers un autre fichier : corrigé">lien corrigé</span>' : '')
                    + ((!e.in_catalogue && (e.public_url || e.url)) ? '<span class="chip out">hors catalogue</span>' : '');
                const info = [e.source && e.status !== 'present' ? `<span class="src">${esc(e.source)}</span>` : '', e.size ? formatSize(e.size) : '', note ? `<span class="${cls}">${note}</span>` : ''].filter(Boolean).join('<span style="opacity:.4">·</span>');
                return `<div class="wf-row ${i === wfSel ? 'sel' : ''}" onclick="wfSelect(${i})" title="Cliquer pour l'ouvrir dans l'éditeur catalogue">${check}<span class="wf-icon ${cls}">${icon}</span><span class="wf-name ${cls}" title="${esc(e.value)}">${esc(e.filename)}</span><span style="display:flex;gap:6px">${chips}</span>${where}<span class="wf-info">${info}</span></div>`;
            }).join('');
            updateWfButton();
        }
        // Clic sur un modele du workflow : selection synchronisee dans le catalogue et l'editeur
        function wfSelect(i) {
            const e = wfRows[i]; if (!e) return;
            wfSel = i; renderWorkflowRows();
            const inCat = Object.values(cfg).some(env => Object.values(env).some(l => l.some(m => m.filename === e.filename)));
            if (inCat) {
                document.getElementById('env-ui').value = '__ALL__';
                document.getElementById('type-ui').value = 'all';
                document.getElementById('search-ui').value = '';
                loadModels(e.filename);
                syncToEditor();
            } else {   // pas encore au catalogue : editeur pre-rempli, il n'y a plus qu'a enregistrer
                Array.from(document.getElementById('models-ui').options).forEach(o => o.selected = false); checkStatus();
                document.getElementById('edit-env').value = document.getElementById('wf-env').value;
                const folder = (e.path || '').split('/')[0];
                if (folder) setEditCat(folder);
                document.getElementById('edit-path').value = BASE_PATH + (e.path || folder);
                document.getElementById('edit-url').value = e.public_url || e.url || '';
                document.getElementById('edit-file').value = e.filename;
                renderCatalogue(e.filename);
            }
            const ed = document.getElementById('editor');
            ed.classList.remove('flash'); void ed.offsetWidth; ed.classList.add('flash');
            document.getElementById('editor-panel').scrollIntoView({behavior: 'smooth', block: 'nearest'});
        }
        // Apres un telechargement : les modeles arrives sur le disque passent en "present"
        function refreshWfPresence() {
            if (!wfRows.length) return;
            const onDisk = new Set(Object.values(diskFiles).flat().map(f => (f.path || '').split('/').pop()));
            let changed = false;
            wfRows.forEach(e => { if (e.status === 'en cours' && onDisk.has(e.filename)) { e.status = 'present'; e.where = e.path + '/' + e.filename; changed = true; } });
            if (changed) renderWorkflowRows();
        }
        function wfChecked() { return Array.from(document.querySelectorAll('.wf-check:checked')).map(c => wfRows[+c.dataset.i]).filter(e => e.status === 'manquant' && e.path); }
        function wfCatalogueCandidates() { return wfRows.filter(e => !e.in_catalogue && (e.public_url || e.url) && e.path && e.status !== 'dossier inconnu'); }
        function updateWfButton() {
            const checked = wfChecked();
            const total = checked.reduce((a, e) => a + (e.size || 0), 0);
            const cand = wfCatalogueCandidates();
            document.getElementById('wf-actions').classList.toggle('hidden', checked.length === 0 && cand.length === 0);
            const dl = document.getElementById('wf-dl-btn');
            dl.disabled = checked.length === 0;
            dl.textContent = `Télécharger ${checked.length} modèle(s)` + (total ? ` · ${formatSize(total)}${checked.some(e => !e.size) ? ' +' : ''}` : '');
            const cb = document.getElementById('wf-cat-btn');
            cb.disabled = cand.length === 0;
            cb.textContent = `Ajouter ${cand.length} modèle(s) au catalogue`;
        }
        async function addCatalogue(rows) {
            const env = document.getElementById('wf-env').value.trim();
            if (!rows.length) return true;
            if (!env) { addLog('Indique un environnement pour les modèles hors catalogue.', true); document.getElementById('wf-env').focus(); return false; }
            const items = rows.map(e => ({filename: e.filename, url: e.public_url || e.url, path: e.path}));
            const r = await (await fetch('/add-to-catalogue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({env, items}) })).json();
            if (r.status !== 'ok') { addLog('Catalogue : ' + esc(r.message || 'erreur'), true); return false; }
            rows.forEach(e => { e.in_catalogue = true; e.url_fixed = false; });
            addLog(`${r.added} modèle(s) ajouté(s) à « ${esc(env)} »` + (r.github_sync === 'ok' ? ', GitHub synchronisé' : ', sync GitHub échouée'), r.github_sync !== 'ok');
            if (r.github_sync === 'ok') showGitHubToast();
            await start(true);
            return true;
        }
        async function addWorkflowToCatalogue() {
            if (await addCatalogue(wfCatalogueCandidates())) renderWorkflowRows();
        }
        async function downloadWorkflowModels() {
            const rows = wfChecked();
            if (document.getElementById('wf-addcat').checked) {
                const cand = wfCatalogueCandidates().filter(e => rows.includes(e));
                if (!(await addCatalogue(cand))) return;
            }
            for (const e of rows) {
                const r = await (await fetch('/download', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url: e.url, path: e.path, filename: e.filename}) })).json();
                addLog(r.status === 'ok' ? `Ajout file d'attente : ${esc(e.path)}/${esc(e.filename)}` : `Erreur ${esc(e.filename)} : ${esc(r.message)}`, r.status !== 'ok');
                if (r.status === 'ok') e.status = 'en cours';
            }
            renderWorkflowRows();
        }

        start();
        loadWorkflowList();
        wfTab('mine');
    </script>
</body>
</html>
